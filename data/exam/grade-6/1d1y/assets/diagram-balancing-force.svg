<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 165" width="720" height="165" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">

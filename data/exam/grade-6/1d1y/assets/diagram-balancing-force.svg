  <line x1="572" y1="74" x2="657" y2="74" stroke="#38bdf8" stroke-width="3.5" marker-end="url(#a-blue)"/>
  <text x="618" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#38bdf8">Bileşke: 5 N</text>
  <text x="540" y="132" text-anchor="middle" font-size="13" fill="#cbd5e1">Yeni bileşke = 0 N (Dengelenmiş)</text>


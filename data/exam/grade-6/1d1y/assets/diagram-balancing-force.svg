  <text x="252" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#14b8a6">8 N</text>
  <text x="175" y="132" text-anchor="middle" font-size="13" fill="#cbd5e1">Bileşke = 8 − 3 = 5 N doğuya</text>

  <line x1="360" y1="14" x2="360" y2="150" stroke="#475569" stroke-width="1.5"/>

  <text x="540" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#34d399">2. Dengeleyici Eklenince: R = 0 N</text>
  

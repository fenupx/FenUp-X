  <rect width="740" height="155" fill="none"/>
  
  <rect x="12" y="14" width="168" height="128" rx="10" fill="#0284c7" fill-opacity="0.1" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="96" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#38bdf8">Vejetatif</text>
  <text x="96" y="72" text-anchor="middle" font-size="13" fill="#cbd5e1">Sürünücü gövde, dal</text>
  <text x="96" y="90" text-anchor="middle" font-size="13" fill="#cbd5e1">veya yumrudan yeni bitki</text>
  <text x="96" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">(Çilek, gül, patates)</text>

  <rect x="194" y="14" width="168" height="128" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#34d399" stroke-width="1.8"/>
  <text x="278" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#34d399">Bölünme</text>
  <text x="278" y="72" text-anchor="middle" font-size="13" fill="#cbd5e1">Ana hücrenin ikiye</text>
  <text x="278" y="90" text-anchor="middle" font-size="13" fill="#cbd5e1">bölünmesiyle üreme</text>
  <text x="278" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">(Amip, öglena, bakteri)</text>

  <rect x="376" y="14" width="168" height="128" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#fbbf24" stroke-width="1.8"/>
  <text x="460" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#fbbf24">Tomurcuklanma</text>
  <text x="460" y="72" text-anchor="middle" font-size="13" fill="#cbd5e1">Ana canlıdaki çıkıntıdan</text>
  <text x="460" y="90" text-anchor="middle" font-size="13" fill="#cbd5e1">yeni birey oluşumu</text>
  <text x="460" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">(Hidra, maya mantarı)</text>

  <rect x="558" y="14" width="170" height="128" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#f87171" stroke-width="1.8"/>
  <text x="643" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#f87171">Rejenerasyon</text>
  <text x="643" y="72" text-anchor="middle" font-size="13" fill="#cbd5e1">Ayrılan parçadan</text>
  <text x="643" y="90" text-anchor="middle" font-size="13" fill="#cbd5e1">yeni birey oluşumu</text>
  <text x="643" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">(Planarya, denizyıldızı)</text>


    <radialGradient id="g-earth" cx="35%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#7dd3fc"/><stop offset="55%" stop-color="#0284c7"/><stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>
    <radialGradient id="g-mars" cx="35%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#fca5a5"/><stop offset="55%" stop-color="#dc2626"/><stop offset="100%" stop-color="#7f1d1d"/>

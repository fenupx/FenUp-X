<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 155" width="740" height="155" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">

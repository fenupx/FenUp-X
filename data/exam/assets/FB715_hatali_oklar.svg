<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400" role="img" aria-labelledby="title"><title id="title">Hatalı haritada Güneş Samanyolunu Samanyolu evreni içerir yazılmıştır</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#087f82"/></marker></defs><rect width="480" height="400" rx="18" fill="#f5f9fa"/><text x="24" y="38" fill="#14283f" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">HATALI ilişki haritası</text><rect x="20" y="75" width="440" height="82" rx="12" fill="#edf6f6"/><text x="36" y="105" fill="#087f82" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">Güneş</text><text x="36" y="137" fill="#14283f" font-family="Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">“Samanyolu’nu içerir.”</text><rect x="20" y="185" width="440" height="82" rx="12" fill="#edf6f6"/><text x="36" y="215" fill="#087f82" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">Samanyolu</text><text x="36" y="247" fill="#14283f" font-family="Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">“Evreni içerir.”</text><text x="24" y="345" fill="#087f82" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">İlişkileri düzelterek açıkla.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400" role="img" aria-labelledby="title"><title id="title">Uzaya çıkarma ve sonra bilimsel ölçüm</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#087f82"/></marker></defs><rect width="480" height="400" rx="18" fill="#f5f9fa"/><text x="24" y="38" fill="#14283f" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">İki görev aşaması</text><rect x="20" y="75" width="440" height="82" rx="12" fill="#edf6f6"/><text x="36" y="105" fill="#087f82" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">1. aşama</text><text x="36" y="137" fill="#14283f" font-family="Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">Dünya’dan uzaya çıkarma</text><path d="M240 162L240 192" stroke="#087f82" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="20" y="205" width="440" height="82" rx="12" fill="#edf6f6"/><text x="36" y="235" fill="#087f82" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">2. aşama</text><text x="36" y="267" fill="#14283f" font-family="Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">Görev ortamında ölçüm yapma</text><text x="24" y="345" fill="#087f82" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">Her aşamanın rolünü belirle.</text></svg>
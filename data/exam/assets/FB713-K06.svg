<svg xmlns="http://www.w3.org/2000/svg" width="480" height="345" viewBox="0 0 480 345" role="img" aria-labelledby="title"><title id="title">Çözüm planının adımları</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#087f82"/></marker></defs><rect width="480" height="345" rx="18" fill="#f5f9fa"/><text x="24" y="38" fill="#14283f" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">Planını kanıta bağla</text><rect x="20" y="60" width="440" height="82" rx="12" fill="#edf6f6"/><text x="36" y="90" fill="#087f82" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">Problemi özetle</text><text x="36" y="122" fill="#14283f" font-family="Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">Nerede, hangi risk?</text><rect x="20" y="145" width="440" height="82" rx="12" fill="#edf6f6"/><text x="36" y="175" fill="#087f82" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">Uygun önlem öner</text><text x="36" y="207" fill="#14283f" font-family="Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">Beklenen yarar ve sınır ne?</text><rect x="20" y="230" width="440" height="82" rx="12" fill="#edf6f6"/><text x="36" y="260" fill="#087f82" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">Sonucu değerlendir</text><text x="36" y="292" fill="#14283f" font-family="Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">Hangi veriyi izleyeceksin?</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="385" viewBox="0 0 480 385" role="img" aria-labelledby="title"><title id="title">Sırası öğrenci tarafından belirlenecek üç kavram</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#087f82"/></marker></defs><rect width="480" height="385" rx="18" fill="#f5f9fa"/><text x="24" y="38" fill="#14283f" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">Bu kavramların kapsamını sırala</text><rect x="20" y="75" width="440" height="82" rx="12" fill="#edf6f6"/><text x="36" y="105" fill="#087f82" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">Samanyolu</text><text x="36" y="137" fill="#14283f" font-family="Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">Hangi kavramları kapsar?</text><rect x="20" y="175" width="440" height="82" rx="12" fill="#edf6f6"/><text x="36" y="205" fill="#087f82" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">Güneş</text><text x="36" y="237" fill="#14283f" font-family="Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">Hangi yapının içinde yer alır?</text><rect x="20" y="275" width="440" height="82" rx="12" fill="#edf6f6"/><text x="36" y="305" fill="#087f82" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">Evren</text><text x="36" y="337" fill="#14283f" font-family="Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">Bütünle ilişkisi nedir?</text></svg>
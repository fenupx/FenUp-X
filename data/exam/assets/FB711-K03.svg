<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400" role="img" aria-labelledby="title"><title id="title">Mekik ve istasyon görev döngüleri</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#087f82"/></marker></defs><rect width="480" height="400" rx="18" fill="#f5f9fa"/><text x="24" y="38" fill="#14283f" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">Ölçütü açıkça belirt</text><rect x="20" y="70" width="440" height="82" rx="12" fill="#edf6f6"/><text x="36" y="100" fill="#087f82" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">Mekik</text><text x="36" y="132" fill="#14283f" font-family="Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">Taşıma → dönüş → yeni uçuş</text><rect x="20" y="170" width="440" height="82" rx="12" fill="#edf6f6"/><text x="36" y="200" fill="#087f82" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">İstasyon</text><text x="36" y="232" fill="#14283f" font-family="Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">Yörüngede yaşam, deney ve bakım</text><text x="24" y="320" fill="#14283f" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">Yeniden uçuş ≠ uzun süre kullanım</text><text x="24" y="365" fill="#14283f" font-family="Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start">Ders kitabındaki araç modelleri.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="350" viewBox="0 0 480 350" role="img" aria-labelledby="title"><title id="title">Karşılaştırma ölçütleri</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#087f82"/></marker></defs><rect width="480" height="350" rx="18" fill="#f5f9fa"/><text x="24" y="38" fill="#14283f" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">Tek özelliğe bakma</text><rect x="20" y="65" width="440" height="82" rx="12" fill="#edf6f6"/><text x="36" y="95" fill="#087f82" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">Görev</text><text x="36" y="127" fill="#14283f" font-family="Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">Ne yapıyor?</text><rect x="20" y="151" width="440" height="82" rx="12" fill="#edf6f6"/><text x="36" y="181" fill="#087f82" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">İnsan ve konum</text><text x="36" y="213" fill="#14283f" font-family="Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">Kim var, nerede çalışıyor?</text><rect x="20" y="237" width="440" height="82" rx="12" fill="#edf6f6"/><text x="36" y="267" fill="#087f82" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">Görev döngüsü</text><text x="36" y="299" fill="#14283f" font-family="Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">Nasıl kullanılıyor / yeniden uçuyor?</text></svg>
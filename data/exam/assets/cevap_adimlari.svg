<svg xmlns="http://www.w3.org/2000/svg" width="480" height="355" viewBox="0 0 480 355" role="img" aria-labelledby="title"><title id="title">Cevap yazma adımları</title><defs><marker id="a1" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#087f82"/></marker><marker id="a2" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#c7781e"/></marker></defs><rect width="480" height="355" rx="20" fill="#f5f9fa"/><text x="24" y="40" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#14283f" text-anchor="start">Gerekçeni dört adımda kur</text><rect x="20" y="65" width="440" height="56" rx="12" fill="#edf6f6"/><text x="40" y="101" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#087f82" text-anchor="start">1</text><text x="85" y="101" font-family="Arial,sans-serif" font-size="20" font-weight="500" fill="#14283f" text-anchor="start">Cismi belirt.</text><rect x="20" y="133" width="440" height="56" rx="12" fill="#edf6f6"/><text x="40" y="169" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#087f82" text-anchor="start">2</text><text x="85" y="169" font-family="Arial,sans-serif" font-size="20" font-weight="500" fill="#14283f" text-anchor="start">İncelenen kuvveti belirt.</text><rect x="20" y="201" width="440" height="56" rx="12" fill="#edf6f6"/><text x="40" y="237" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#087f82" text-anchor="start">3</text><text x="85" y="237" font-family="Arial,sans-serif" font-size="20" font-weight="500" fill="#14283f" text-anchor="start">Yer değiştirmeyi incele.</text><rect x="20" y="269" width="440" height="56" rx="12" fill="#edf6f6"/><text x="40" y="305" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#087f82" text-anchor="start">4</text><text x="85" y="305" font-family="Arial,sans-serif" font-size="20" font-weight="500" fill="#14283f" text-anchor="start">Sonucunu gerekçelendir.</text></svg>
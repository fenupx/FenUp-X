<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400" role="img" aria-labelledby="title"><title id="title">Güneş yıldız Dünya gezegendir</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#087f82"/></marker></defs><rect width="480" height="400" rx="18" fill="#f5f9fa"/><text x="24" y="38" fill="#14283f" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">İki farklı gök cismi türü</text><circle cx="125" cy="160" r="60" fill="#edb85d"/><circle cx="125" cy="160" r="37.2" fill="#f7dba0"/><circle cx="350" cy="160" r="43" fill="#385e89"/><path d="M319.9 138.5q25.8 -17.2 34.4 12.9t8.6 30.099999999999998q-17.2 12.9 -23.650000000000002 -6.45z" fill="#72ab9b"/><text x="125" y="265" fill="#14283f" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">Güneş: yıldız</text><text x="350" y="265" fill="#14283f" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">Dünya: gezegen</text><text x="24" y="345" fill="#14283f" font-family="Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start">Görsel boyutlar gerçek ölçekte değildir.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400" role="img" aria-labelledby="title"><title id="title">Veriyi sınırlı yorumla</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#087f82"/></marker></defs><rect width="480" height="400" rx="18" fill="#f5f9fa"/><text x="24" y="38" fill="#14283f" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">Sayıyı, nedenlerle birlikte oku</text><rect x="20" y="65" width="440" height="82" rx="12" fill="#edf6f6"/><text x="36" y="95" fill="#087f82" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">Yeni oluşan parçalar</text><text x="36" y="127" fill="#14283f" font-family="Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">Biriktirici etki</text><rect x="20" y="165" width="440" height="82" rx="12" fill="#edf6f6"/><text x="36" y="195" fill="#087f82" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">Ortamdan çıkan parçalar</text><text x="36" y="227" fill="#14283f" font-family="Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">Azaltıcı etki</text><text x="24" y="320" fill="#14283f" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">Son sayı tek başına neden göstermez.</text><text x="24" y="365" fill="#14283f" font-family="Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">Aynı bölge / benzer izleme koşulları.</text></svg>
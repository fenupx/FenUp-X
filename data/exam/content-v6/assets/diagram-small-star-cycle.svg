<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>
  <!-- Küçük Kütleli Yıldız Yaşam Döngüsü -->
  <!-- 1. Küçük Yıldız -->
  <g transform="translate(30, 20)">
    <circle cx="50" cy="60" r="22" fill="#eab308" stroke="#fef08a" stroke-width="2"/>
    <text x="50" y="115" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Küçük Kütleli</text>
    <text x="50" y="132" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Yıldız (Örn: Güneş)</text>
  </g>
  <path d="M 115 80 L 165 80" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="165,76 173,80 165,84" fill="#38bdf8"/>

  <!-- 2. Kırmızı Dev -->
  <g transform="translate(180, 20)">
    <circle cx="60" cy="60" r="42" fill="#dc2626" stroke="#fca5a5" stroke-width="2" opacity="0.9"/>
    <text x="60" y="125" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Kırmızı Dev</text>
    <text x="60" y="142" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Hacmi genişler</text>
  </g>
  <path d="M 290 80 L 335 80" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="335,76 343,80 335,84" fill="#38bdf8"/>

  <!-- 3. Gezegenimsi Bulutsu -->
  <g transform="translate(350, 20)">
    <circle cx="60" cy="60" r="40" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4"/>
    <circle cx="60" cy="60" r="22" fill="none" stroke="#c084fc" stroke-width="2"/>
    <circle cx="60" cy="60" r="7" fill="#ffffff"/>
    <text x="60" y="125" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Gezegenimsi Bulutsu</text>
    <text x="60" y="142" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Dış gaz katmanı saçılır</text>
  </g>
  <path d="M 465 80 L 515 80" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="515,76 523,80 515,84" fill="#38bdf8"/>

  <!-- 4. Beyaz Cüce -->
  <g transform="translate(530, 20)">
    <circle cx="45" cy="60" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="45" cy="60" r="18" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="45" y="115" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Beyaz Cüce</text>
    <text x="45" y="132" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Sıcak, yoğun çekirdek</text>
  </g>
</svg>
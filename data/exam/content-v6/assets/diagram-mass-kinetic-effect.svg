<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>

  <!-- Üst Şerit: Otomobil (1000 kg, 60 km/h) -->
  <g transform="translate(40, 20)">
    <line x1="0" y1="70" x2="600" y2="70" stroke="#475569" stroke-width="2"/>
    <rect x="15" y="30" width="75" height="26" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="32" cy="56" r="8" fill="#0f172a" stroke="#cbd5e1"/>
    <circle cx="74" cy="56" r="8" fill="#0f172a" stroke="#cbd5e1"/>
    <rect x="190" y="25" width="18" height="45" fill="#d97706" stroke="#fbbf24"/>
    <line x1="208" y1="47" x2="260" y2="47" stroke="#94a3b8" stroke-dasharray="3,3"/>
    <rect x="260" y="25" width="18" height="45" fill="#d97706" opacity="0.4" stroke="#fbbf24"/>
  </g>
  <g>
    <rect x="50" y="8" width="125" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="112" y="23" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">1000 kg Otomobil</text>
  </g>
  <g>
    <rect x="320" y="15" width="130" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="385" y="30" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Takoz 1 m İtildi</text>
  </g>

  <!-- Alt Şerit: Kamyon (5000 kg, 60 km/h) -->
  <g transform="translate(40, 125)">
    <line x1="0" y1="70" x2="600" y2="70" stroke="#475569" stroke-width="2"/>
    <rect x="5" y="15" width="105" height="42" rx="4" fill="#b91c1c" stroke="#ef4444" stroke-width="2"/>
    <circle cx="25" cy="57" r="9" fill="#0f172a" stroke="#cbd5e1"/>
    <circle cx="55" cy="57" r="9" fill="#0f172a" stroke="#cbd5e1"/>
    <circle cx="95" cy="57" r="9" fill="#0f172a" stroke="#cbd5e1"/>
    <rect x="220" y="25" width="18" height="45" fill="#d97706" stroke="#fbbf24"/>
    <line x1="238" y1="47" x2="430" y2="47" stroke="#ef4444" stroke-dasharray="3,3" stroke-width="2"/>
    <rect x="430" y="25" width="18" height="45" fill="#d97706" opacity="0.4" stroke="#fbbf24"/>
  </g>
  <g>
    <rect x="50" y="115" width="125" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="112" y="130" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">5000 kg Kamyon</text>
  </g>
  <g>
    <rect x="490" y="120" width="130" height="24" rx="12" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="555" y="135" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Takoz 5 m İtildi</text>
  </g>
</svg>
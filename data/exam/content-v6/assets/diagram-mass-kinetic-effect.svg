<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>

  <!-- Üst: Otomobil -->
  <g transform="translate(40, 35)">
    <line x1="0" y1="70" x2="600" y2="70" stroke="#475569" stroke-width="2"/>
    <rect x="20" y="25" width="80" height="30" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <rect x="40" y="8" width="45" height="20" rx="3" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="38" cy="55" r="9" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="82" cy="55" r="9" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="60" y="-2" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif" paint-order="stroke fill" stroke="#0b0f19" stroke-width="2.5px">Hafif Otomobil (1000 kg)</text>
    <line x1="110" y1="40" x2="160" y2="40" stroke="#10b981" stroke-width="3"/>
    <polygon points="160,36 170,40 160,44" fill="#10b981"/>
    <text x="140" y="28" fill="#10b981" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" paint-order="stroke fill" stroke="#0b0f19" stroke-width="2.5px">60 km/h</text>
    <rect x="230" y="25" width="22" height="45" fill="#d97706" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="252" y1="45" x2="310" y2="45" stroke="#94a3b8" stroke-dasharray="3,3"/>
    <rect x="310" y="25" width="22" height="45" fill="#d97706" opacity="0.4" stroke="#fbbf24"/>
    <text x="350" y="48" fill="#f8fafc" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" paint-order="stroke fill" stroke="#0b0f19" stroke-width="2.5px">Takoz Az İtildi</text>
    <text x="350" y="65" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" paint-order="stroke fill" stroke="#0b0f19" stroke-width="2.5px">Daha Az Kinetik Enerji</text>
  </g>

  <!-- Alt: Kamyon -->
  <g transform="translate(40, 145)">
    <line x1="0" y1="70" x2="600" y2="70" stroke="#475569" stroke-width="2"/>
    <rect x="10" y="10" width="105" height="45" rx="4" fill="#b91c1c" stroke="#ef4444" stroke-width="2"/>
    <rect x="90" y="22" width="30" height="33" rx="3" fill="#991b1b" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="28" cy="55" r="10" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="58" cy="55" r="10" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="102" cy="55" r="10" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="65" y="-2" fill="#ef4444" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif" paint-order="stroke fill" stroke="#0b0f19" stroke-width="2.5px">Ağır Kamyon (5000 kg)</text>
    <line x1="130" y1="40" x2="180" y2="40" stroke="#10b981" stroke-width="3"/>
    <polygon points="180,36 190,40 180,44" fill="#10b981"/>
    <text x="160" y="28" fill="#10b981" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" paint-order="stroke fill" stroke="#0b0f19" stroke-width="2.5px">60 km/h (Aynı)</text>
    <rect x="230" y="25" width="22" height="45" fill="#d97706" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="252" y1="45" x2="430" y2="45" stroke="#ef4444" stroke-dasharray="3,3" stroke-width="2"/>
    <rect x="430" y="25" width="22" height="45" fill="#d97706" opacity="0.4" stroke="#fbbf24"/>
    <text x="465" y="44" fill="#ef4444" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" paint-order="stroke fill" stroke="#0b0f19" stroke-width="2.5px">Takoz Çok İtildi</text>
    <text x="465" y="60" fill="#fca5a5" font-size="11" font-family="system-ui, sans-serif" paint-order="stroke fill" stroke="#0b0f19" stroke-width="2.5px">Daha Fazla Kinetik Enerji</text>
  </g>

  <rect x="100" y="235" width="480" height="22" rx="11" fill="#0f172a" stroke="#334155"/>
  <text x="340" y="250" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif" paint-order="stroke fill" stroke="#0b0f19" stroke-width="2.5px">Sonuç: Süratleri eşitken kütlesi büyük olan aracın kinetik enerjisi daha fazladır.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>

  <!-- 1. Düzenek: Hafif Bilye (Küçük Çap) -->
  <g transform="translate(40, 20)">
    <line x1="0" y1="80" x2="600" y2="80" stroke="#64748b" stroke-width="2"/>
    <polygon points="10,80 110,80 10,25" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="20" cy="22" r="10" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <line x1="120" y1="65" x2="165" y2="65" stroke="#10b981" stroke-width="3"/>
    <polygon points="165,61 175,65 165,69" fill="#10b981"/>

    <rect x="200" y="45" width="16" height="35" fill="#d97706" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="216" y1="62" x2="275" y2="62" stroke="#94a3b8" stroke-dasharray="3,3"/>
    <rect x="275" y="45" width="16" height="35" fill="#d97706" opacity="0.4" stroke="#fbbf24"/>

    <rect x="10" y="-8" width="115" height="22" rx="11" fill="#0f172a" stroke="#38bdf8"/>
    <text x="67" y="7" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Hafif Bilye</text>

    <rect x="305" y="50" width="130" height="24" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="370" y="66" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Takoz Az İtildi</text>
  </g>

  <!-- 2. Düzenek: Ağır Bilye (Büyük Çap, Aynı Yükseklikten Bırakılır) -->
  <g transform="translate(40, 140)">
    <line x1="0" y1="80" x2="600" y2="80" stroke="#64748b" stroke-width="2"/>
    <polygon points="10,80 110,80 10,25" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="23" cy="20" r="18" fill="#ef4444" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="120" y1="65" x2="165" y2="65" stroke="#10b981" stroke-width="3"/>
    <polygon points="165,61 175,65 165,69" fill="#10b981"/>

    <rect x="200" y="45" width="16" height="35" fill="#d97706" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="216" y1="62" x2="440" y2="62" stroke="#ef4444" stroke-dasharray="3,3" stroke-width="2"/>
    <rect x="440" y="45" width="16" height="35" fill="#d97706" opacity="0.4" stroke="#fbbf24"/>

    <rect x="10" y="-12" width="115" height="22" rx="11" fill="#0f172a" stroke="#ef4444"/>
    <text x="67" y="3" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Ağır Bilye</text>

    <rect x="470" y="50" width="140" height="24" rx="12" fill="#0f172a" stroke="#ef4444"/>
    <text x="540" y="66" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Takoz Çok İtildi</text>
  </g>
</svg>
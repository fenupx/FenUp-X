<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>
  <line x1="30" y1="135" x2="310" y2="135" stroke="#64748b" stroke-width="3"/>
  <line x1="370" y1="135" x2="650" y2="135" stroke="#64748b" stroke-width="3"/>

  <!-- Sol: Duran Otomobil -->
  <g transform="translate(105, 80)">
    <rect x="0" y="18" width="110" height="26" rx="5" fill="#64748b"/>
    <polygon points="20,18 35,2 75,2 90,18" fill="#94a3b8"/>
    <circle cx="25" cy="45" r="10" fill="#334155" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="85" cy="45" r="10" fill="#334155" stroke="#cbd5e1" stroke-width="2"/>
    <text x="55" y="-14" fill="#64748b" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Duran Otomobil (Hareketsiz)</text>
    <text x="55" y="82" fill="#64748b" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Kinetik Enerji = 0</text>
  </g>

  <!-- Sağ: Hareketli Otomobil -->
  <g transform="translate(435, 80)">
    <rect x="0" y="18" width="110" height="26" rx="5" fill="#0284c7"/>
    <polygon points="20,18 35,2 75,2 90,18" fill="#38bdf8"/>

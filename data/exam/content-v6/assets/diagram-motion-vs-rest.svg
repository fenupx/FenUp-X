    <line x1="120" y1="28" x2="165" y2="28" stroke="#059669" stroke-width="3.5"/>
    <polygon points="165,23 177,28 165,33" fill="#059669"/>
    <text x="55" y="-14" fill="#0284c7" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Hareketli Otomobil</text>
    <text x="55" y="82" fill="#059669" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Kinetik Enerjiye Sahiptir</text>

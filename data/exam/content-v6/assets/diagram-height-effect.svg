<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>
  <line x1="40" y1="170" x2="640" y2="170" stroke="#64748b" stroke-width="2"/>
  <rect x="50" y="170" width="580" height="30" fill="#eab308" opacity="0.25" rx="3"/>
  <g>
    <rect x="55" y="175" width="90" height="22" rx="11" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="100" y="189" fill="#fbbf24" font-size="10" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Kum Havuzu</text>
  </g>

  <!-- 1 Metre Bilye -->
  <g transform="translate(200, 105)">
    <circle cx="0" cy="0" r="15" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <line x1="0" y1="16" x2="0" y2="65" stroke="#94a3b8" stroke-dasharray="3,3"/>
    <ellipse cx="0" cy="65" rx="14" ry="6" fill="#ca8a04"/>
  </g>
  <g>
    <rect x="155" y="70" width="90" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="200" y="85" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">1 Metre</text>
  </g>
  <g>
    <rect x="155" y="135" width="90" height="22" rx="11" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="200" y="149" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Sığ Çukur</text>
  </g>

  <!-- 2 Metre Bilye -->
  <g transform="translate(480, 45)">
    <circle cx="0" cy="0" r="15" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <line x1="0" y1="16" x2="0" y2="125" stroke="#94a3b8" stroke-dasharray="3,3"/>
    <ellipse cx="0" cy="125" rx="25" ry="13" fill="#0284c7"/>
  </g>
  <g>
    <rect x="435" y="10" width="90" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="480" y="25" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">2 Metre</text>
  </g>
  <g>
    <rect x="435" y="135" width="90" height="22" rx="11" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="480" y="149" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Derin Çukur</text>
  </g>

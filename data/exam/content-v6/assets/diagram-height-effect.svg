<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>
  <line x1="40" y1="175" x2="660" y2="175" stroke="#64748b" stroke-width="2.5"/>
  <rect x="50" y="175" width="600" height="35" fill="#eab308" opacity="0.22" rx="4"/>
  <text x="350" y="200" fill="#d97706" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Kum Havuzu</text>

  <!-- 1 Metre -->
  <g transform="translate(190, 105)">
    <circle cx="0" cy="0" r="15" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
    <line x1="0" y1="16" x2="0" y2="70" stroke="#94a3b8" stroke-dasharray="4,4" stroke-width="1.5"/>
    <ellipse cx="0" cy="70" rx="14" ry="6" fill="#ca8a04"/>
    <text x="0" y="-20" fill="#0284c7" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">1 kg Bilye (h = 1 m)</text>
    <text x="0" y="98" fill="#0284c7" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Sığ Çukur (Az Enerji)</text>
  </g>

  <!-- 2 Metre -->
  <g transform="translate(510, 45)">
    <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
    <line x1="0" y1="16" x2="0" y2="130" stroke="#94a3b8" stroke-dasharray="4,4" stroke-width="1.5"/>
    <ellipse cx="0" cy="130" rx="25" ry="13" fill="#991b1b"/>
    <text x="0" y="-20" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">1 kg Bilye (h = 2 m)</text>
    <text x="0" y="158" fill="#dc2626" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Derin Çukur (Çok Enerji)</text>
  </g>
</svg>
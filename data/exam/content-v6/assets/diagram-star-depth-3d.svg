<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>
  <line x1="60" y1="105" x2="660" y2="105" stroke="#64748b" stroke-width="3"/>
  <polygon points="660,100 675,105 660,110" fill="#64748b"/>

  <!-- 1. Güneş ve Dünya -->
  <g transform="translate(95, 105)">
    <circle cx="0" cy="0" r="16" fill="#eab308" stroke="#d97706" stroke-width="2"/>
    <circle cx="28" cy="0" r="7" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
    <text x="12" y="-30" fill="#d97706" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Güneş ve Dünya</text>
    <text x="12" y="40" fill="#64748b" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Başlangıç (0)</text>
  </g>

  <!-- 2. Proxima Centauri -->
  <g transform="translate(360, 105)">
    <circle cx="0" cy="0" r="13" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
    <line x1="-235" y1="-25" x2="0" y2="-25" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="4,4"/>
    <text x="-118" y="-35" fill="#0284c7" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">4,2 Işık Yılı Mesafe</text>
    <text x="0" y="-30" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Proxima Centauri</text>
    <text x="0" y="40" fill="#0284c7" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">En Yakın Yıldız</text>
  </g>

  <!-- 3. Kutup Yıldızı -->
  <g transform="translate(600, 105)">
    <circle cx="0" cy="0" r="14" fill="#eab308" stroke="#d97706" stroke-width="2.5"/>
    <text x="0" y="-30" fill="#d97706" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Kutup Yıldızı</text>
    <text x="0" y="40" fill="#d97706" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">~430 Işık Yılı</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 220" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>
  <!-- Dünya Gözlemcisi -->
  <g transform="translate(40, 110)">
    <circle cx="0" cy="0" r="16" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="32" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Dünya</text>
  </g>

  <!-- Görüş Açısı Işınları -->
  <line x1="56" y1="105" x2="600" y2="60" stroke="#64748b" stroke-dasharray="3,3"/>
  <line x1="56" y1="110" x2="600" y2="110" stroke="#64748b" stroke-dasharray="3,3"/>
  <line x1="56" y1="115" x2="600" y2="160" stroke="#64748b" stroke-dasharray="3,3"/>

  <!-- A Yıldızı: 50 ışık yılı -->
  <g transform="translate(180, 95)">
    <circle cx="0" cy="0" r="7" fill="#fde047"/>
    <text x="0" y="-14" fill="#fde047" font-size="12" font-weight="bold" text-anchor="middle">A Yıldızı</text>
    <text x="0" y="20" fill="#94a3b8" font-size="11" text-anchor="middle">50 ışık yılı</text>
  </g>

  <!-- B Yıldızı: 450 ışık yılı -->
  <g transform="translate(380, 110)">
    <circle cx="0" cy="0" r="9" fill="#38bdf8"/>
    <text x="0" y="-16" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">B Yıldızı</text>
    <text x="0" y="22" fill="#94a3b8" font-size="11" text-anchor="middle">450 ışık yılı</text>
  </g>

  <!-- C Yıldızı: 1200 ışık yılı -->
  <g transform="translate(560, 125)">
    <circle cx="0" cy="0" r="8" fill="#f43f5e"/>
    <text x="0" y="-15" fill="#f43f5e" font-size="12" font-weight="bold" text-anchor="middle">C Yıldızı</text>
    <text x="0" y="22" fill="#94a3b8" font-size="11" text-anchor="middle">1200 ışık yılı</text>
  </g>

  <text x="330" y="195" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">Dünya'dan yan yana görünürler; ancak uzayda aralarında fiziksel bağ yoktur.</text>
</svg>
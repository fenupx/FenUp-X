<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>

  <!-- Kozmik Mesafe Ekseni -->
  <line x1="60" y1="120" x2="660" y2="120" stroke="#64748b" stroke-width="3"/>
  <polygon points="660,115 675,120 660,125" fill="#64748b"/>

  <!-- 1. Güneş & Dünya (0 Işık Yılı) -->
  <g transform="translate(90, 120)">
    <circle cx="0" cy="0" r="16" fill="#eab308" stroke="#ffffff" stroke-width="2"/>
    <circle cx="28" cy="0" r="7" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
  </g>
  <g>
    <rect x="35" y="60" width="135" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="102" y="77" fill="#fde047" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Güneş ve Dünya</text>
  </g>
  <g>
    <rect x="45" y="155" width="115" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="102" y="170" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Başlangıç (0)</text>
  </g>

  <!-- 2. Proxima Centauri (~4.2 Işık Yılı) -->
  <g transform="translate(360, 120)">
    <circle cx="0" cy="0" r="13" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <!-- Mesafe Çizgisi -->
    <line x1="-240" y1="-40" x2="0" y2="-40" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>
  <g>
    <rect x="175" y="15" width="110" height="24" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="230" y="31" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">4,2 Işık Yılı</text>
  </g>
  <g>
    <rect x="290" y="60" width="140" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="360" y="77" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Proxima Centauri</text>
  </g>
  <g>
    <rect x="295" y="155" width="130" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="360" y="170" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">En Yakın Yıldız</text>
  </g>

  <!-- 3. Kutup Yıldızı (~430 Işık Yılı) -->
  <g transform="translate(600, 120)">
    <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#eab308" stroke-width="2.5"/>
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#fde047" stroke-width="1.5"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#fde047" stroke-width="1.5"/>
  </g>
  <g>
    <rect x="525" y="60" width="150" height="26" rx="13" fill="#0f172a" stroke="#eab308" stroke-width="1.5"/>
    <text x="600" y="77" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Kutup Yıldızı</text>
  </g>
  <g>
    <rect x="530" y="155" width="140" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="600" y="170" fill="#fde047" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">~430 Işık Yılı</text>
  </g>
</svg>
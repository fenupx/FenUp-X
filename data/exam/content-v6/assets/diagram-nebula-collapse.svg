<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>
  <!-- Aşama 1: Bulutsu (Gaz ve Toz) -->
  <g transform="translate(10, 20)">
    <circle cx="90" cy="90" r="75" fill="#0284c7" fill-opacity="0.15" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="70" cy="80" r="30" fill="#0284c7" opacity="0.35"/>
    <circle cx="110" cy="100" r="35" fill="#7c3aed" opacity="0.3"/>
    <circle cx="95" cy="70" r="22" fill="#e11d48" opacity="0.3"/>
    <!-- İçe doğru net çekim okları -->
    <line x1="25" y1="90" x2="55" y2="90" stroke="#0284c7" stroke-width="2.5"/>
    <polygon points="55,86 63,90 55,94" fill="#0284c7"/>
    <line x1="155" y1="90" x2="125" y2="90" stroke="#0284c7" stroke-width="2.5"/>
    <polygon points="125,86 117,90 125,94" fill="#0284c7"/>
    <line x1="90" y1="25" x2="90" y2="55" stroke="#0284c7" stroke-width="2.5"/>
    <polygon points="86,55 90,63 94,55" fill="#0284c7"/>
    <line x1="90" y1="155" x2="90" y2="125" stroke="#0284c7" stroke-width="2.5"/>
    <polygon points="86,125 90,117 94,125" fill="#0284c7"/>
    <text x="90" y="190" fill="#0284c7" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">1. Bulutsu (Nebula)</text>
    <text x="90" y="210" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Gaz-toz kütle çekimiyle sıkışır</text>
  </g>

  <!-- Geçiş Oku 1 -> 2 -->
  <line x1="205" y1="110" x2="255" y2="110" stroke="#38bdf8" stroke-width="3"/>
  <polygon points="255,104 267,110 255,116" fill="#38bdf8"/>

  <!-- Aşama 2: Ön Yıldız (Protostar) -->
  <g transform="translate(265, 20)">
    <circle cx="75" cy="90" r="50" fill="#d97706" opacity="0.25"/>
    <circle cx="75" cy="90" r="32" fill="#f59e0b" stroke="#fef08a" stroke-width="2.5"/>
    <circle cx="75" cy="90" r="16" fill="#ffffff"/>
    <text x="75" y="190" fill="#0284c7" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">2. Ön Yıldız (Protostar)</text>
    <text x="75" y="210" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Sıcaklık ve basınç artar</text>
  </g>

  <!-- Geçiş Oku 2 -> 3 -->
  <line x1="435" y1="110" x2="485" y2="110" stroke="#38bdf8" stroke-width="3"/>
  <polygon points="485,104 497,110 485,116" fill="#38bdf8"/>

  <!-- Aşama 3: Kararlı Yıldız -->
  <g transform="translate(495, 20)">
    <circle cx="80" cy="90" r="42" fill="#f43f5e" opacity="0.3"/>
    <circle cx="80" cy="90" r="28" fill="#e11d48" stroke="#ffe4e6" stroke-width="2.5"/>
    <circle cx="80" cy="90" r="14" fill="#ffffff"/>
    <!-- Işıma okları -->
    <line x1="80" y1="35" x2="80" y2="15" stroke="#fbbf24" stroke-width="2"/>
    <line x1="80" y1="145" x2="80" y2="165" stroke="#fbbf24" stroke-width="2"/>
    <line x1="25" y1="90" x2="5" y2="90" stroke="#fbbf24" stroke-width="2"/>
    <line x1="135" y1="90" x2="155" y2="90" stroke="#fbbf24" stroke-width="2"/>
    <text x="80" y="190" fill="#0284c7" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">3. Kararlı Yıldız</text>
    <text x="80" y="210" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Işık ve ısı yaymaya başlar</text>
  </g>
</svg>
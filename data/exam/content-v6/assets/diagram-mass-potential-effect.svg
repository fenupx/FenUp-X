<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>
  <line x1="30" y1="190" x2="650" y2="190" stroke="#64748b" stroke-width="2"/>
  <rect x="40" y="190" width="600" height="35" fill="#eab308" opacity="0.25" rx="4"/>
  <text x="55" y="212" fill="#fbbf24" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" paint-order="stroke fill" stroke="#0b0f19" stroke-width="2.5px">Kum Havuzu Zemin Seviyesi</text>

  <line x1="80" y1="50" x2="600" y2="50" stroke="#38bdf8" stroke-dasharray="6,4" stroke-width="1.5"/>
  <text x="340" y="42" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif" paint-order="stroke fill" stroke="#0b0f19" stroke-width="2.5px">Aynı Yükseklik Seviyesi</text>

  <!-- Hafif Bilye -->
  <g transform="translate(160, 50)">
    <circle cx="30" cy="0" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <text x="30" y="-22" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif" paint-order="stroke fill" stroke="#0b0f19" stroke-width="2.5px">Hafif Bilye (1 kg)</text>
    <line x1="30" y1="18" x2="30" y2="140" stroke="#94a3b8" stroke-dasharray="4,4"/>
    <polygon points="30,140 26,130 34,130" fill="#94a3b8"/>
    <ellipse cx="30" cy="140" rx="16" ry="6" fill="#ca8a04" stroke="#eab308" stroke-width="1.5"/>
    <text x="30" y="166" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif" paint-order="stroke fill" stroke="#0b0f19" stroke-width="2.5px">Sığ Çukur</text>
    <text x="30" y="182" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif" paint-order="stroke fill" stroke="#0b0f19" stroke-width="2.5px">Daha Az Potansiyel Enerji</text>
  </g>

  <!-- Ağır Gülle -->
  <g transform="translate(480, 50)">
    <circle cx="30" cy="0" r="24" fill="#ef4444" stroke="#ffffff" stroke-width="2.5"/>
    <text x="30" y="-30" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif" paint-order="stroke fill" stroke="#0b0f19" stroke-width="2.5px">Ağır Gülle (5 kg)</text>
    <line x1="30" y1="28" x2="30" y2="140" stroke="#94a3b8" stroke-dasharray="4,4"/>
    <polygon points="30,140 26,130 34,130" fill="#94a3b8"/>
    <ellipse cx="30" cy="140" rx="30" ry="16" fill="#991b1b" stroke="#ef4444" stroke-width="2"/>
    <text x="30" y="172" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif" paint-order="stroke fill" stroke="#0b0f19" stroke-width="2.5px">Derin Çukur</text>
    <text x="30" y="188" fill="#fca5a5" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif" paint-order="stroke fill" stroke="#0b0f19" stroke-width="2.5px">Daha Fazla Potansiyel Enerji</text>
  </g>

  <rect x="100" y="232" width="480" height="24" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="340" y="248" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif" paint-order="stroke fill" stroke="#0b0f19" stroke-width="2.5px">Sonuç: Yükseklikler eşitken kütlesi büyük olan cisim kuma daha derin batar.</text>
</svg>
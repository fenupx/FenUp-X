<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>
  <!-- Kum Havuzu Zemin -->
  <line x1="40" y1="170" x2="640" y2="170" stroke="#64748b" stroke-width="2"/>
  <rect x="50" y="170" width="580" height="30" fill="#eab308" opacity="0.25" rx="3"/>
  <g>
    <rect x="55" y="175" width="90" height="22" rx="11" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="100" y="189" fill="#fbbf24" font-size="10" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Kum Havuzu</text>
  </g>

  <!-- Ortak Yükseklik Çizgisi -->
  <line x1="100" y1="50" x2="580" y2="50" stroke="#38bdf8" stroke-dasharray="5,4" stroke-width="1.5"/>
  <g>
    <rect x="285" y="38" width="150" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="360" y="53" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Aynı Yükseklik (2 m)</text>
  </g>

  <!-- 1 kg Bilye -->
  <g transform="translate(180, 50)">
    <circle cx="0" cy="0" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <line x1="0" y1="15" x2="0" y2="120" stroke="#94a3b8" stroke-dasharray="3,3"/>
    <ellipse cx="0" cy="120" rx="14" ry="6" fill="#ca8a04"/>
  </g>
  <g>
    <rect x="135" y="10" width="90" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="180" y="25" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">1 kg Bilye</text>
  </g>
  <g>
    <rect x="135" y="135" width="90" height="22" rx="11" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="180" y="149" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Sığ Çukur</text>
  </g>

  <!-- 5 kg Gülle -->
  <g transform="translate(500, 50)">
    <circle cx="0" cy="0" r="24" fill="#ef4444" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="0" y1="25" x2="0" y2="120" stroke="#94a3b8" stroke-dasharray="3,3"/>
    <ellipse cx="0" cy="120" rx="28" ry="15" fill="#991b1b"/>
  </g>
  <g>
    <rect x="455" y="10" width="90" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="500" y="25" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">5 kg Gülle</text>
  </g>
  <g>
    <rect x="455" y="135" width="90" height="22" rx="11" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="500" y="149" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Derin Çukur</text>
  </g>
</svg>
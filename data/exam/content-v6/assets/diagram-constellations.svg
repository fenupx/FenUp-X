<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>

  <!-- ================= BÜYÜKAYI ================= -->
  <!-- Sap -->
  <polyline points="40,285 95,270 145,260 185,255" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <!-- Kepçe -->
  <polygon points="185,255 185,305 230,305 230,255" stroke="#38bdf8" stroke-width="2.5" fill="none"/>

  <circle cx="40" cy="285" r="4.5" fill="#ffffff"/>
  <circle cx="95" cy="270" r="4.5" fill="#ffffff"/>
  <circle cx="145" cy="260" r="4.5" fill="#ffffff"/>
  <circle cx="185" cy="255" r="4.5" fill="#ffffff"/>
  <circle cx="185" cy="305" r="4.5" fill="#ffffff"/>

  <!-- İşaretçi Yıldızlar: Merak ve Dubhe (x=230 tam dikey hat) -->
  <circle cx="230" cy="305" r="6.5" fill="#fde047" stroke="#ffffff" stroke-width="2"/>
  <circle cx="230" cy="255" r="6.5" fill="#fde047" stroke="#ffffff" stroke-width="2"/>

  <g>
    <rect x="245" y="293" width="62" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="276" y="308" fill="#fde047" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Merak</text>
  </g>
  <g>
    <rect x="245" y="243" width="62" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="276" y="258" fill="#fde047" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Dubhe</text>
  </g>
  <g>
    <rect x="100" y="315" width="95" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="147" y="332" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Büyükayı</text>
  </g>

  <!-- ================= 5 KAT KILAVUZ ÇİZGİSİ (TAM DİKEY) ================= -->
  <!-- 255 -> 40 (tam dikey x=230) -->
  <line x1="230" y1="255" x2="230" y2="40" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="230,32 225,44 235,44" fill="#f43f5e"/>

  <!-- 4 Ara Adım Çentiği -->
  <circle cx="230" cy="212" r="3" fill="#f43f5e"/>
  <circle cx="230" cy="169" r="3" fill="#f43f5e"/>
  <circle cx="230" cy="126" r="3" fill="#f43f5e"/>
  <circle cx="230" cy="83" r="3" fill="#f43f5e"/>

  <!-- 5 Kat Uzaklık Etiketi (Sol tarafta ferah boşlukta) -->
  <g>
    <rect x="105" y="135" width="105" height="26" rx="13" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="157" y="152" fill="#f43f5e" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">5 Kat Uzaklık</text>
  </g>

  <!-- ================= KUTUP YILDIZI (POLARIS) ================= -->
  <g transform="translate(230, 40)">
    <circle cx="0" cy="0" r="16" fill="#fef08a" opacity="0.45"/>
    <circle cx="0" cy="0" r="8.5" fill="#ffffff" stroke="#eab308" stroke-width="2.5"/>
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#fde047" stroke-width="2"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#fde047" stroke-width="2"/>
  </g>
  <!-- Kutup Yıldızı Etiketi (Üstte ferah boşlukta) -->
  <g>
    <rect x="145" y="5" width="170" height="26" rx="13" fill="#0f172a" stroke="#eab308" stroke-width="1.5"/>
    <text x="230" y="22" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Kutup Yıldızı (Polaris)</text>
  </g>

  <!-- ================= KÜÇÜKAYI ================= -->
  <!-- Sap ucu Polaris'ten başlar, sağa doğru uzanır -->
  <polyline points="230,40 305,55 375,80" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <polygon points="375,80 430,65 475,95 425,115" stroke="#94a3b8" stroke-width="2" fill="none"/>

  <circle cx="305" cy="55" r="4" fill="#cbd5e1"/>
  <circle cx="375" cy="80" r="4" fill="#cbd5e1"/>
  <circle cx="430" cy="65" r="4" fill="#cbd5e1"/>
  <circle cx="475" cy="95" r="5" fill="#cbd5e1"/>
  <circle cx="425" cy="115" r="5" fill="#cbd5e1"/>
  <g>
    <rect x="410" y="30" width="85" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="452" y="46" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Küçükayı</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>

  <!-- Büyükayı -->
  <polyline points="45,275 100,260 150,250 190,245" stroke="#0284c7" stroke-width="2.5" fill="none"/>
  <polygon points="190,245 190,295 235,295 235,245" stroke="#0284c7" stroke-width="2.5" fill="none"/>

  <circle cx="45" cy="275" r="4.5" fill="#0284c7"/>
  <circle cx="100" cy="260" r="4.5" fill="#0284c7"/>
  <circle cx="150" cy="250" r="4.5" fill="#0284c7"/>
  <circle cx="190" cy="245" r="4.5" fill="#0284c7"/>
  <circle cx="190" cy="295" r="4.5" fill="#0284c7"/>
  <circle cx="235" cy="295" r="6.5" fill="#eab308" stroke="#d97706" stroke-width="2"/>
  <circle cx="235" cy="245" r="6.5" fill="#eab308" stroke="#d97706" stroke-width="2"/>
  <text x="145" y="325" fill="#0284c7" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Büyükayı Takımyıldızı</text>

  <!-- 5 Kat Mesafe Kılavuz Çizgisi -->
  <line x1="235" y1="245" x2="235" y2="50" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="235,42 230,54 240,54" fill="#e11d48"/>
  <circle cx="235" cy="206" r="3" fill="#e11d48"/>
  <circle cx="235" cy="167" r="3" fill="#e11d48"/>
  <circle cx="235" cy="128" r="3" fill="#e11d48"/>
  <circle cx="235" cy="89" r="3" fill="#e11d48"/>
  <text x="215" y="152" fill="#e11d48" font-size="13" font-weight="bold" text-anchor="end" font-family="system-ui, sans-serif">5 Kat Uzaklık</text>

  <!-- Kutup Yıldızı -->
  <g transform="translate(235, 50)">
    <circle cx="0" cy="0" r="15" fill="#fef08a" opacity="0.45"/>
    <circle cx="0" cy="0" r="8" fill="#eab308" stroke="#d97706" stroke-width="2"/>
    <line x1="0" y1="-16" x2="0" y2="16" stroke="#d97706" stroke-width="2"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#d97706" stroke-width="2"/>
  </g>
  <text x="235" y="24" fill="#d97706" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Kutup Yıldızı (Kuzey)</text>

  <!-- Küçükayı -->
  <polyline points="235,50 310,65 380,90" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="380,90 435,75 480,105 430,125" stroke="#64748b" stroke-width="2" fill="none"/>
  <circle cx="310" cy="65" r="4" fill="#64748b"/>
  <circle cx="380" cy="90" r="4" fill="#64748b"/>
  <circle cx="435" cy="75" r="4" fill="#64748b"/>
  <circle cx="480" cy="105" r="5" fill="#64748b"/>
  <circle cx="430" cy="125" r="5" fill="#64748b"/>
  <text x="445" y="55" fill="#64748b" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Küçükayı Takımyıldızı</text>
</svg>
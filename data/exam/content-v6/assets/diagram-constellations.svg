<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>
  <!-- Büyükayı ve Kutup Yıldızı Bulma Rehberi -->
  <!-- Büyükayı (Ursa Major) -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <polyline points="70,180 120,165 170,160 210,185 280,180 270,130 200,135 210,185"/>
  </g>
  <!-- Büyükayı Yıldızları -->
  <circle cx="70" cy="180" r="4" fill="#ffffff"/>
  <circle cx="120" cy="165" r="4" fill="#ffffff"/>
  <circle cx="170" cy="160" r="4" fill="#ffffff"/>
  <circle cx="210" cy="185" r="4" fill="#ffffff"/>
  <circle cx="280" cy="180" r="4" fill="#ffffff"/>
  <circle cx="270" cy="130" r="5" fill="#fde047"/> <!-- Merak -->
  <circle cx="200" cy="135" r="5" fill="#fde047"/> <!-- Dubhe -->
  <text x="210" y="215" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Büyükayı (Cezve Bölümü)</text>

  <!-- 5 Kat Hizalama Doğrusu -->
  <line x1="270" y1="130" x2="480" y2="40" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="360" y="70" fill="#f43f5e" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">~ 5 Kat Mesafe Uzatılır</text>

  <!-- Kutup Yıldızı (Polaris) -->
  <circle cx="490" cy="35" r="7" fill="#ffffff" stroke="#38bdf8" stroke-width="3"/>
  <line x1="490" y1="20" x2="490" y2="10" stroke="#fde047" stroke-width="2"/>
  <line x1="490" y1="50" x2="490" y2="60" stroke="#fde047" stroke-width="2"/>
  <line x1="475" y1="35" x2="465" y2="35" stroke="#fde047" stroke-width="2"/>
  <line x1="505" y1="35" x2="515" y2="35" stroke="#fde047" stroke-width="2"/>

  <text x="490" y="80" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Kutup Yıldızı (Polaris)</text>
  <text x="490" y="98" fill="#38bdf8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Küçükayı Kuyruk Ucu / Daima Kuzey</text>
</svg>
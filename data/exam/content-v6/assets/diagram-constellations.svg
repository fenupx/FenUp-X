<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>

  <!-- ================= BÜYÜKAYI (BÜYÜK KEPÇE) ================= -->
  <!-- Sap: Alkaid (40, 310) -> Mizar (95, 290) -> Alioth (150, 280) -->
  <!-- Kepçe: Megrez (200, 275) -> Phecda (205, 335) -> Merak (270, 335) -> Dubhe (270, 275) -> Megrez (200, 275) -->
  <polyline points="40,310 95,290 150,280 200,275" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <polygon points="200,275 205,335 270,335 270,275" stroke="#38bdf8" stroke-width="2.5" fill="none"/>

  <circle cx="40" cy="310" r="4.5" fill="#ffffff"/>
  <circle cx="95" cy="290" r="4.5" fill="#ffffff"/>
  <circle cx="150" cy="280" r="4.5" fill="#ffffff"/>
  <circle cx="200" cy="275" r="4.5" fill="#ffffff"/>
  <circle cx="205" cy="335" r="4.5" fill="#ffffff"/>
  <!-- İşaretçi Yıldızlar: Merak ve Dubhe (x=270 tam dikey hat) -->
  <circle cx="270" cy="335" r="7" fill="#fde047" stroke="#ffffff" stroke-width="2"/>
  <circle cx="270" cy="275" r="7" fill="#fde047" stroke="#ffffff" stroke-width="2"/>

  <text x="290" y="340" fill="#fde047" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" paint-order="stroke fill" stroke="#0b0f19" stroke-width="2.5px">Merak</text>
  <text x="290" y="278" fill="#fde047" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" paint-order="stroke fill" stroke="#0b0f19" stroke-width="2.5px">Dubhe</text>
  <text x="140" y="365" fill="#38bdf8" font-size="15" font-weight="bold" font-family="system-ui, sans-serif" paint-order="stroke fill" stroke="#0b0f19" stroke-width="2.5px">Büyükayı (Büyük Kepçe)</text>

  <!-- ================= 5 KAT KILAVUZ ÇİZGİSİ (TAM DÜZ VE DİKEY) ================= -->
  <!-- Merak (270, 335) ile Dubhe (270, 275) arası tam 60 px. -->
  <!-- 275 - (5 * 45 px) = 50 px. -->
  <line x1="270" y1="335" x2="270" y2="45" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="270,36 264,48 276,48" fill="#f43f5e"/>

  <!-- 5 Adım Çentikleri ve Mesafe Sayıları -->
  <circle cx="270" cy="229" r="2.5" fill="#f43f5e"/>
  <text x="250" y="233" fill="#f43f5e" font-size="11" font-weight="bold" text-anchor="end" font-family="system-ui, sans-serif" paint-order="stroke fill" stroke="#0b0f19" stroke-width="2.5px">1. Kat</text>
  <circle cx="270" cy="183" r="2.5" fill="#f43f5e"/>
  <text x="250" y="187" fill="#f43f5e" font-size="11" font-weight="bold" text-anchor="end" font-family="system-ui, sans-serif" paint-order="stroke fill" stroke="#0b0f19" stroke-width="2.5px">2. Kat</text>
  <circle cx="270" cy="137" r="2.5" fill="#f43f5e"/>
  <text x="250" y="141" fill="#f43f5e" font-size="11" font-weight="bold" text-anchor="end" font-family="system-ui, sans-serif" paint-order="stroke fill" stroke="#0b0f19" stroke-width="2.5px">3. Kat</text>
  <circle cx="270" cy="91" r="2.5" fill="#f43f5e"/>
  <text x="250" y="95" fill="#f43f5e" font-size="11" font-weight="bold" text-anchor="end" font-family="system-ui, sans-serif" paint-order="stroke fill" stroke="#0b0f19" stroke-width="2.5px">4. Kat</text>
  <text x="250" y="55" fill="#f43f5e" font-size="11" font-weight="bold" text-anchor="end" font-family="system-ui, sans-serif" paint-order="stroke fill" stroke="#0b0f19" stroke-width="2.5px">5. Kat</text>

  <!-- ================= KUTUP YILDIZI (POLARIS) ================= -->
  <g transform="translate(270, 50)">
    <circle cx="0" cy="0" r="16" fill="#fef08a" opacity="0.35"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff" stroke="#eab308" stroke-width="2.5"/>
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#fde047" stroke-width="2"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#fde047" stroke-width="2"/>
    <text x="24" y="-3" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" paint-order="stroke fill" stroke="#0b0f19" stroke-width="2.5px">Kutup Yıldızı (Polaris)</text>
    <text x="24" y="14" fill="#38bdf8" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" paint-order="stroke fill" stroke="#0b0f19" stroke-width="2.5px">Daima Kuzey Yönünü Gösterir</text>
  </g>

  <!-- ================= KÜÇÜKAYI (KÜÇÜK KEPÇE) ================= -->
  <polyline points="270,50 335,65 395,90" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <polygon points="395,90 450,75 495,105 445,125" stroke="#94a3b8" stroke-width="2" fill="none"/>

  <circle cx="335" cy="65" r="4" fill="#cbd5e1"/>
  <circle cx="395" cy="90" r="4" fill="#cbd5e1"/>
  <circle cx="450" cy="75" r="4" fill="#cbd5e1"/>
  <circle cx="495" cy="105" r="5" fill="#cbd5e1"/>
  <circle cx="445" cy="125" r="5" fill="#cbd5e1"/>
  <text x="430" y="55" fill="#94a3b8" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" paint-order="stroke fill" stroke="#0b0f19" stroke-width="2.5px">Küçükayı (Küçük Kepçe)</text>
</svg>
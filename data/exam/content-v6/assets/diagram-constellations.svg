<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>
  
  <!-- BÜYÜKAYI (URSA MAJOR) - 7 YILDIZ -->
  <!-- Sap Yıldızları: Alkaid (80,310) -> Mizar (140,285) -> Alioth (200,270) -->
  <!-- Cezve Yıldızları: Megrez (260,265) -> Phecda (285,335) -> Merak (385,320) -> Dubhe (375,230) -> Megrez (260,265) -->
  <polyline points="80,310 140,285 200,270 260,265" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <polygon points="260,265 285,335 385,320 375,230" stroke="#38bdf8" stroke-width="2.5" fill="none"/>

  <!-- Büyükayı Yıldız Noktaları -->
  <circle cx="80" cy="310" r="5" fill="#ffffff"/>
  <circle cx="140" cy="285" r="5" fill="#ffffff"/>
  <circle cx="200" cy="270" r="5" fill="#ffffff"/>
  <circle cx="260" cy="265" r="5" fill="#ffffff"/>
  <circle cx="285" cy="335" r="5" fill="#ffffff"/>
  <circle cx="385" cy="320" r="7" fill="#fde047" stroke="#ffffff" stroke-width="1.5"/> <!-- Merak -->
  <circle cx="375" cy="230" r="7" fill="#fde047" stroke="#ffffff" stroke-width="1.5"/> <!-- Dubhe -->

  <!-- Yıldız İsimleri -->
  <text x="405" y="325" fill="#fde047" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">Merak</text>
  <text x="395" y="235" fill="#fde047" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">Dubhe</text>
  <text x="230" y="360" fill="#38bdf8" font-size="16" font-weight="bold" font-family="system-ui, sans-serif">Büyükayı (Büyük Kepçe)</text>

  <!-- 5 KAT İŞARETÇİ ÇİZGİSİ: Merak (385,320) -> Dubhe (375,230) doğrultusu -->
  <!-- dx = -10, dy = -90. Birim mesafe = 90px. -->
  <!-- Dubhe'den itibaren 5 kat ilerisi: (375 - 50, 230 - 450)... Küçükayı sap ucuna (350, 75) doğru -->
  <line x1="385" y1="320" x2="355" y2="75" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="355,67 348,80 362,80" fill="#f43f5e"/>

  <!-- 5 Kat Adım Çentikleri ve Etiket -->
  <circle cx="371" cy="199" r="2.5" fill="#f43f5e"/>
  <circle cx="367" cy="168" r="2.5" fill="#f43f5e"/>
  <circle cx="363" cy="137" r="2.5" fill="#f43f5e"/>
  <circle cx="359" cy="106" r="2.5" fill="#f43f5e"/>
  <text x="400" y="155" fill="#f43f5e" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">5 Kat Mesafe</text>

  <!-- KÜÇÜKAYI (URSA MINOR) - 7 YILDIZ -->
  <!-- Sap ucu: Kutup Yıldızı (350, 65) -->
  <!-- Sap: (350,65) -> (410,75) -> (465,100) -->
  <!-- Cezve: (465,100) -> (515,80) -> (565,110) -> (520,135) -> (465,100) -->
  <polyline points="350,65 410,75 465,100" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <polygon points="465,100 515,80 565,110 520,135" stroke="#94a3b8" stroke-width="2" fill="none"/>

  <!-- Küçükayı Yıldız Noktaları -->
  <circle cx="410" cy="75" r="4" fill="#cbd5e1"/>
  <circle cx="465" cy="100" r="4" fill="#cbd5e1"/>
  <circle cx="515" cy="80" r="4" fill="#cbd5e1"/>
  <circle cx="565" cy="110" r="5" fill="#cbd5e1"/>
  <circle cx="520" cy="135" r="5" fill="#cbd5e1"/>

  <!-- KUTUP YILDIZI (POLARIS) - IŞILTILI VE BELİRGİN -->
  <g transform="translate(350, 65)">
    <circle cx="0" cy="0" r="14" fill="#fef08a" opacity="0.3"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff" stroke="#eab308" stroke-width="2.5"/>
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#fde047" stroke-width="2"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#fde047" stroke-width="2"/>
    <text x="-15" y="-25" fill="#ffffff" font-size="16" font-weight="bold" font-family="system-ui, sans-serif">Kutup Yıldızı (Polaris)</text>
    <text x="-15" y="-7" fill="#38bdf8" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">Daima Kuzeyi Gösterir</text>
  </g>
  <text x="500" y="55" fill="#94a3b8" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">Küçükayı</text>
</svg>
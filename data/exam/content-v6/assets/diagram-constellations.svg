<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 260" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>
  <!-- Büyükayı (Ursa Major) Cezve Şekli -->
  <!-- Sap kısmı -->
  <polyline points="50,200 110,185 170,175 220,195" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <!-- Cezve tabanı ve ağzı -->
  <!-- Taban: Megrez (220,195) -> Phecda (280,210) -> Merak (340,195) -> Dubhe (330,135) -> Megrez (220,195) -->
  <polygon points="220,195 280,210 340,195 330,135" stroke="#38bdf8" stroke-width="2" fill="none"/>

  <!-- Büyükayı Yıldızları -->
  <circle cx="50" cy="200" r="4.5" fill="#ffffff"/>
  <circle cx="110" cy="185" r="4.5" fill="#ffffff"/>
  <circle cx="170" cy="175" r="4.5" fill="#ffffff"/>
  <circle cx="220" cy="195" r="4.5" fill="#ffffff"/>
  <circle cx="280" cy="210" r="4.5" fill="#ffffff"/>
  <circle cx="340" cy="195" r="6" fill="#fde047"/> <!-- Merak (Cezve dibi) -->
  <circle cx="330" cy="135" r="6" fill="#fde047"/> <!-- Dubhe (Cezve kenarı) -->
  <text x="365" y="200" fill="#94a3b8" font-size="11">Merak</text>
  <text x="355" y="140" fill="#94a3b8" font-size="11">Dubhe</text>

  <!-- Cezve ucu 5 Kat Hizalama Doğrusu: Merak(340,195) -> Dubhe(330,135) vektörü yukarı-sol yöndedir! -->
  <!-- Vektör: dx = -10, dy = -60. Dubhe'den itibaren 5 kat: (330 - 50, 135 - 110) = (280, 25) -->
  <line x1="340" y1="195" x2="280" y2="25" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="365" y="75" fill="#f43f5e" font-size="12" font-weight="bold">~ 5 Kat Uzatılır</text>

  <!-- Kutup Yıldızı (Polaris) -->
  <g transform="translate(280, 25)">
    <circle cx="0" cy="0" r="8" fill="#ffffff" stroke="#38bdf8" stroke-width="3"/>
    <line x1="0" y1="-14" x2="0" y2="14" stroke="#fde047" stroke-width="2"/>
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#fde047" stroke-width="2"/>
    <text x="18" y="5" fill="#ffffff" font-size="14" font-weight="bold">Kutup Yıldızı (Polaris)</text>
    <text x="18" y="22" fill="#38bdf8" font-size="12">Daima Coğrafi Kuzeyi Gösterir</text>
  </g>
  <text x="180" y="240" fill="#94a3b8" font-size="13" font-weight="bold">Büyükayı Takımyıldızı</text>
</svg>
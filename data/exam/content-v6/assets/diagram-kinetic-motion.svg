<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 190" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>
  <!-- Deniz Yüzeyi -->
  <line x1="20" y1="135" x2="600" y2="135" stroke="#38bdf8" stroke-width="2.5"/>
  <path d="M 30 145 Q 60 155 90 145 T 150 145 T 210 145 T 270 145 T 330 145 T 390 145 T 450 145 T 510 145 T 570 145" fill="none" stroke="#0284c7" stroke-width="2" opacity="0.6"/>

  <!-- Tekne Gövdesi -->
  <g transform="translate(150, 45)">
    <path d="M 0 70 L 150 70 L 175 45 L 20 45 Z" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <rect x="35" y="20" width="70" height="25" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <rect x="85" y="5" width="12" height="15" fill="#e2e8f0"/>
    <circle cx="55" cy="32" r="5" fill="#38bdf8"/>
    <circle cx="75" cy="32" r="5" fill="#38bdf8"/>
    <!-- Kütle Etiketi -->
    <text x="80" y="62" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">m = 5000 kg</text>
    <!-- Sürat Vektörü Oku -->
    <line x1="185" y1="50" x2="275" y2="50" stroke="#f43f5e" stroke-width="4"/>
    <polygon points="275,44 290,50 275,56" fill="#f43f5e"/>
    <text x="235" y="36" fill="#f43f5e" font-size="15" font-weight="bold">v = 10 m/s</text>
  </g>
  <text x="310" y="175" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">Kinetik Enerji: Cisim hareket halindedir (Kütle ve Sürate bağlıdır)</text>
</svg>
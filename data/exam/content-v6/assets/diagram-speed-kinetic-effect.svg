<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>

  <!-- Üst Şerit: Yavaş Araç (40 km/h) -->
  <g transform="translate(40, 20)">
    <line x1="0" y1="70" x2="600" y2="70" stroke="#475569" stroke-width="2"/>
    <rect x="20" y="26" width="75" height="28" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="36" cy="54" r="8" fill="#0f172a" stroke="#cbd5e1"/>
    <circle cx="78" cy="54" r="8" fill="#0f172a" stroke="#cbd5e1"/>
    <!-- Takoz -->
    <rect x="200" y="25" width="18" height="45" fill="#d97706" stroke="#fbbf24"/>
    <line x1="218" y1="47" x2="280" y2="47" stroke="#94a3b8" stroke-dasharray="3,3"/>
    <rect x="280" y="25" width="18" height="45" fill="#d97706" opacity="0.4" stroke="#fbbf24"/>
  </g>
  <g>
    <rect x="50" y="8" width="100" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="100" y="23" fill="#10b981" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">40 km/saat</text>
  </g>
  <g>
    <rect x="340" y="15" width="130" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="405" y="30" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Takoz 1 m İtildi</text>
  </g>

  <!-- Alt Şerit: Hızlı Araç (90 km/h) -->
  <g transform="translate(40, 125)">
    <line x1="0" y1="70" x2="600" y2="70" stroke="#475569" stroke-width="2"/>
    <rect x="20" y="26" width="75" height="28" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="36" cy="54" r="8" fill="#0f172a" stroke="#cbd5e1"/>
    <circle cx="78" cy="54" r="8" fill="#0f172a" stroke="#cbd5e1"/>
    <!-- Takoz -->
    <rect x="200" y="25" width="18" height="45" fill="#d97706" stroke="#fbbf24"/>
    <line x1="218" y1="47" x2="430" y2="47" stroke="#f43f5e" stroke-dasharray="3,3" stroke-width="2"/>
    <rect x="430" y="25" width="18" height="45" fill="#d97706" opacity="0.4" stroke="#fbbf24"/>
  </g>
  <g>
    <rect x="50" y="115" width="100" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="100" y="130" fill="#f43f5e" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">90 km/saat</text>
  </g>
  <g>
    <rect x="490" y="120" width="130" height="24" rx="12" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="555" y="135" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Takoz 4 m İtildi</text>
  </g>
</svg>
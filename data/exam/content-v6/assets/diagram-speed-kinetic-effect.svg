<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>

  <!-- 1. Düzenek: Alçak Rampa (Yavaş Bilye) -->
  <g transform="translate(40, 20)">
    <!-- Yatay Zemin -->
    <line x1="0" y1="80" x2="600" y2="80" stroke="#64748b" stroke-width="2"/>
    <!-- Eğik Düzlem / Rampa (Alçak: 1 Kitap) -->
    <polygon points="10,80 110,80 10,45" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Bilye (Alçakta) -->
    <circle cx="22" cy="40" r="11" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <!-- Yatay Sürat Oku -->
    <line x1="120" y1="65" x2="160" y2="65" stroke="#10b981" stroke-width="2.5"/>
    <polygon points="160,61 170,65 160,69" fill="#10b981"/>
    <!-- Takoz -->
    <rect x="200" y="45" width="16" height="35" fill="#d97706" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="216" y1="62" x2="270" y2="62" stroke="#94a3b8" stroke-dasharray="3,3"/>
    <rect x="270" y="45" width="16" height="35" fill="#d97706" opacity="0.4" stroke="#fbbf24"/>

    <!-- Etiketler -->
    <rect x="10" y="10" width="125" height="22" rx="11" fill="#0f172a" stroke="#38bdf8"/>
    <text x="72" y="25" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Daha Az Süratli</text>

    <rect x="300" y="50" width="130" height="24" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="365" y="66" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Takoz Az İtildi</text>
  </g>

  <!-- 2. Düzenek: Yüksek Rampa (Hızlı Bilye) -->
  <g transform="translate(40, 140)">
    <!-- Yatay Zemin -->
    <line x1="0" y1="80" x2="600" y2="80" stroke="#64748b" stroke-width="2"/>
    <!-- Eğik Düzlem / Rampa (Yüksek: 3 Kitap) -->
    <polygon points="10,80 110,80 10,20" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Bilye (Yüksekte) -->
    <circle cx="20" cy="18" r="11" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <!-- Yatay Sürat Oku (Uzun) -->
    <line x1="120" y1="65" x2="190" y2="65" stroke="#f43f5e" stroke-width="3.5"/>
    <polygon points="190,60 202,65 190,70" fill="#f43f5e"/>
    <!-- Takoz -->
    <rect x="215" y="45" width="16" height="35" fill="#d97706" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="231" y1="62" x2="430" y2="62" stroke="#f43f5e" stroke-dasharray="3,3" stroke-width="2"/>
    <rect x="430" y="45" width="16" height="35" fill="#d97706" opacity="0.4" stroke="#fbbf24"/>

    <!-- Etiketler -->
    <rect x="10" y="-12" width="125" height="22" rx="11" fill="#0f172a" stroke="#f43f5e"/>
    <text x="72" y="3" fill="#f43f5e" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Daha Süratli</text>

    <rect x="460" y="50" width="140" height="24" rx="12" fill="#0f172a" stroke="#ef4444"/>
    <text x="530" y="66" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Takoz Çok İtildi</text>
  </g>
</svg>
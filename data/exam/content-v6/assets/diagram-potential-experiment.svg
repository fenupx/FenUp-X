<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>

  <!-- Kum Havuzu -->
  <line x1="20" y1="185" x2="640" y2="185" stroke="#64748b" stroke-width="2"/>
  <rect x="30" y="185" width="600" height="25" fill="#eab308" opacity="0.25" rx="3"/>
  <text x="45" y="202" fill="#fbbf24" font-size="12" font-weight="bold">Kum Havuzu Zemin Seviyesi</text>

  <!-- 1. Düzenek: 1 kg Bilye, 2 Metre -->
  <g transform="translate(110, 25)">
    <circle cx="30" cy="25" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <text x="30" y="-8" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">1 kg Bilye</text>
    <line x1="55" y1="25" x2="55" y2="160" stroke="#94a3b8" stroke-dasharray="3,3"/>
    <text x="68" y="95" fill="#38bdf8" font-size="12" font-weight="bold">2 Metre</text>
    <ellipse cx="30" cy="160" rx="14" ry="7" fill="#ca8a04"/>
    <text x="30" y="218" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">1. Düzenek</text>
  </g>

  <!-- 2. Düzenek: 2 kg Bilye, 2 Metre -->
  <g transform="translate(300, 25)">
    <circle cx="35" cy="25" r="22" fill="#ef4444" stroke="#ffffff" stroke-width="2.5"/>
    <text x="35" y="-8" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">2 kg Bilye</text>
    <line x1="70" y1="25" x2="70" y2="160" stroke="#94a3b8" stroke-dasharray="3,3"/>
    <text x="83" y="95" fill="#ef4444" font-size="12" font-weight="bold">2 Metre</text>
    <ellipse cx="35" cy="160" rx="24" ry="14" fill="#991b1b"/>
    <text x="35" y="218" fill="#ef4444" font-size="13" font-weight="bold" text-anchor="middle">2. Düzenek (En Derin)</text>
  </g>

  <!-- 3. Düzenek: 1 kg Bilye, 1 Metre -->
  <g transform="translate(480, 25)">
    <circle cx="30" cy="90" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <text x="30" y="58" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">1 kg Bilye</text>
    <line x1="55" y1="90" x2="55" y2="160" stroke="#94a3b8" stroke-dasharray="3,3"/>
    <text x="68" y="128" fill="#38bdf8" font-size="12" font-weight="bold">1 Metre</text>
    <ellipse cx="30" cy="160" rx="10" ry="4" fill="#ca8a04"/>
    <text x="30" y="218" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">3. Düzenek (En Sığ)</text>
  </g>
</svg>
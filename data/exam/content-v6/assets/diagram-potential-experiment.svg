<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>

  <!-- Kum Havuzu Zemin -->
  <line x1="20" y1="185" x2="640" y2="185" stroke="#64748b" stroke-width="2"/>
  <rect x="30" y="185" width="600" height="25" fill="#eab308" opacity="0.25" rx="3"/>
  <rect x="40" y="188" width="95" height="20" rx="10" fill="#0f172a" stroke="#fbbf24"/>
  <text x="87" y="202" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Kum Havuzu</text>

  <!-- 1. Düzenek: 1 kg Bilye, 2 Metre -->
  <g transform="translate(110, 25)">
    <circle cx="30" cy="25" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <rect x="-15" y="-12" width="90" height="20" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="2" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">1 kg Bilye</text>
    <line x1="55" y1="25" x2="55" y2="160" stroke="#94a3b8" stroke-dasharray="3,3"/>
    <rect x="65" y="85" width="65" height="20" rx="10" fill="#0f172a" stroke="#38bdf8"/>
    <text x="97" y="99" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">2 Metre</text>
    <ellipse cx="30" cy="160" rx="14" ry="7" fill="#ca8a04"/>
    <rect x="-15" y="210" width="90" height="24" rx="12" fill="#0f172a" stroke="#38bdf8"/>
    <text x="30" y="226" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">1. Düzenek</text>
  </g>

  <!-- 2. Düzenek: 2 kg Bilye, 2 Metre -->
  <g transform="translate(300, 25)">
    <circle cx="35" cy="25" r="22" fill="#ef4444" stroke="#ffffff" stroke-width="2.5"/>
    <rect x="-10" y="-12" width="90" height="20" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="35" y="2" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">2 kg Bilye</text>
    <line x1="70" y1="25" x2="70" y2="160" stroke="#94a3b8" stroke-dasharray="3,3"/>
    <rect x="80" y="85" width="65" height="20" rx="10" fill="#0f172a" stroke="#ef4444"/>
    <text x="112" y="99" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">2 Metre</text>
    <ellipse cx="35" cy="160" rx="24" ry="14" fill="#991b1b"/>
    <rect x="-10" y="210" width="90" height="24" rx="12" fill="#0f172a" stroke="#ef4444"/>
    <text x="35" y="226" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">2. Düzenek</text>
  </g>

  <!-- 3. Düzenek: 1 kg Bilye, 1 Metre -->
  <g transform="translate(480, 25)">
    <circle cx="30" cy="90" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <rect x="-15" y="52" width="90" height="20" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="66" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">1 kg Bilye</text>
    <line x1="55" y1="90" x2="55" y2="160" stroke="#94a3b8" stroke-dasharray="3,3"/>
    <rect x="65" y="118" width="65" height="20" rx="10" fill="#0f172a" stroke="#38bdf8"/>
    <text x="97" y="132" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">1 Metre</text>
    <ellipse cx="30" cy="160" rx="10" ry="4" fill="#ca8a04"/>
    <rect x="-15" y="210" width="90" height="24" rx="12" fill="#0f172a" stroke="#38bdf8"/>
    <text x="30" y="226" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">3. Düzenek</text>
  </g>
</svg>
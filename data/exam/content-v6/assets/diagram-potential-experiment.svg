<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>
  <!-- Kum Havuzu Zemin Tablası -->
  <line x1="30" y1="180" x2="610" y2="180" stroke="#64748b" stroke-width="2"/>
  <rect x="40" y="180" width="560" height="25" fill="#eab308" opacity="0.3"/>
  <text x="50" y="198" fill="#fbbf24" font-size="12" font-weight="bold">Kum Havuzu</text>

  <!-- 1. Düzenek: m, 2h -->
  <g transform="translate(110, 20)">
    <circle cx="30" cy="30" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <text x="30" y="34" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">m</text>
    <line x1="55" y1="30" x2="55" y2="160" stroke="#94a3b8" stroke-dasharray="3,3"/>
    <text x="70" y="95" fill="#38bdf8" font-size="13" font-weight="bold">2h</text>
    <ellipse cx="30" cy="160" rx="14" ry="7" fill="#eab308"/>
    <text x="30" y="215" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">1. Düzenek</text>
  </g>

  <!-- 2. Düzenek: 2m, 2h -->
  <g transform="translate(280, 20)">
    <circle cx="35" cy="30" r="22" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <text x="35" y="35" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">2m</text>
    <line x1="70" y1="30" x2="70" y2="160" stroke="#94a3b8" stroke-dasharray="3,3"/>
    <text x="85" y="95" fill="#ef4444" font-size="13" font-weight="bold">2h</text>
    <ellipse cx="35" cy="160" rx="22" ry="14" fill="#b45309"/>
    <text x="35" y="215" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">2. Düzenek (En Derin)</text>
  </g>

  <!-- 3. Düzenek: m, h -->
  <g transform="translate(450, 20)">
    <circle cx="30" cy="95" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <text x="30" y="99" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">m</text>
    <line x1="55" y1="95" x2="55" y2="160" stroke="#94a3b8" stroke-dasharray="3,3"/>
    <text x="70" y="130" fill="#38bdf8" font-size="13" font-weight="bold">h</text>
    <ellipse cx="30" cy="160" rx="10" ry="4" fill="#eab308"/>
    <text x="30" y="215" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">3. Düzenek (En Sığ)</text>
  </g>
</svg>
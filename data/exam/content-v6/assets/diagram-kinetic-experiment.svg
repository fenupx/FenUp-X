<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>

  <!-- 1. Düzenek: 1000 kg, 50 km/h -->
  <g transform="translate(40, 25)">
    <line x1="0" y1="45" x2="580" y2="45" stroke="#475569" stroke-width="2"/>
    <rect x="10" y="18" width="55" height="22" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="24" cy="40" r="6" fill="#0f172a" stroke="#cbd5e1"/>
    <circle cx="52" cy="40" r="6" fill="#0f172a" stroke="#cbd5e1"/>
    <text x="75" y="32" fill="#10b981" font-size="11" font-weight="bold">50 km/h</text>
    <!-- Takoz İtme -->
    <rect x="160" y="15" width="16" height="30" fill="#d97706" stroke="#fbbf24"/>
    <line x1="176" y1="30" x2="230" y2="30" stroke="#94a3b8" stroke-dasharray="3,3"/>
    <rect x="230" y="15" width="16" height="30" fill="#d97706" opacity="0.4"/>
    <text x="270" y="33" fill="#f8fafc" font-size="12" font-weight="bold">1. Düzenek: 1000 kg Otomobil, 50 km/h</text>
  </g>

  <!-- 2. Düzenek: 2000 kg, 50 km/h (Kütle Etkisi) -->
  <g transform="translate(40, 95)">
    <line x1="0" y1="45" x2="580" y2="45" stroke="#475569" stroke-width="2"/>
    <rect x="5" y="10" width="65" height="30" rx="3" fill="#b91c1c" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="22" cy="40" r="7" fill="#0f172a" stroke="#cbd5e1"/>
    <circle cx="55" cy="40" r="7" fill="#0f172a" stroke="#cbd5e1"/>
    <text x="80" y="32" fill="#10b981" font-size="11" font-weight="bold">50 km/h</text>
    <!-- Takoz İtme -->
    <rect x="160" y="15" width="16" height="30" fill="#d97706" stroke="#fbbf24"/>
    <line x1="176" y1="30" x2="310" y2="30" stroke="#ef4444" stroke-dasharray="3,3"/>
    <rect x="310" y="15" width="16" height="30" fill="#d97706" opacity="0.4"/>
    <text x="350" y="33" fill="#ef4444" font-size="12" font-weight="bold">2. Düzenek: 2000 kg Kamyonet, 50 km/h</text>
  </g>

  <!-- 3. Düzenek: 1000 kg, 100 km/h (Sürat Etkisi) -->
  <g transform="translate(40, 165)">
    <line x1="0" y1="45" x2="580" y2="45" stroke="#475569" stroke-width="2"/>
    <rect x="10" y="18" width="55" height="22" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="24" cy="40" r="6" fill="#0f172a" stroke="#cbd5e1"/>
    <circle cx="52" cy="40" r="6" fill="#0f172a" stroke="#cbd5e1"/>
    <text x="75" y="32" fill="#f43f5e" font-size="11" font-weight="bold">100 km/h</text>
    <!-- Takoz İtme -->
    <rect x="160" y="15" width="16" height="30" fill="#d97706" stroke="#fbbf24"/>
    <line x1="176" y1="30" x2="420" y2="30" stroke="#f43f5e" stroke-dasharray="3,3"/>
    <rect x="420" y="15" width="16" height="30" fill="#d97706" opacity="0.4"/>
    <text x="450" y="33" fill="#f43f5e" font-size="12" font-weight="bold">3. Düzenek: 1000 kg, 100 km/h (En Uzak)</text>
  </g>
</svg>
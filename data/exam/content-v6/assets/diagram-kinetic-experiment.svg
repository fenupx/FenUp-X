<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>
  <!-- 1. Düzenek (Baz): m, v -> Kumda batma/durma mesafesi x -->
  <g transform="translate(30, 20)">
    <rect x="0" y="10" width="65" height="32" rx="4" fill="#3b82f6"/>
    <text x="32" y="31" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">m, v</text>
    <line x1="75" y1="26" x2="105" y2="26" stroke="#38bdf8" stroke-width="2.5"/>
    <polygon points="105,23 111,26 105,29" fill="#38bdf8"/>
    <!-- Kum zemin izi x -->
    <rect x="130" y="18" width="55" height="16" fill="#eab308" opacity="0.6"/>
    <text x="157" y="31" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">İz: x</text>
    <text x="210" y="31" fill="#f8fafc" font-size="13">1. Düzenek (Kütle: m, Sürat: v)</text>
  </g>

  <!-- 2. Düzenek: Kütle 2 Kat (2m, v) -> İz: 2x (Kütle Etkisi) -->
  <g transform="translate(30, 80)">
    <rect x="0" y="8" width="80" height="36" rx="4" fill="#ef4444"/>
    <text x="40" y="31" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">2m, v</text>
    <line x1="90" y1="26" x2="120" y2="26" stroke="#ef4444" stroke-width="2.5"/>
    <polygon points="120,23 126,26 120,29" fill="#ef4444"/>
    <!-- Kum zemin izi 2x -->
    <rect x="145" y="18" width="110" height="16" fill="#eab308" opacity="0.6"/>
    <text x="200" y="31" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">İz: 2x (Kütle 2 kat)</text>
    <text x="280" y="31" fill="#f8fafc" font-size="13">2. Düzenek (Kütle: 2m, Sürat: v)</text>
  </g>

  <!-- 3. Düzenek: Sürat 2 Kat (m, 2v) -> İz: 4x (Sürat Etkisi) -->
  <g transform="translate(30, 140)">
    <rect x="0" y="10" width="65" height="32" rx="4" fill="#10b981"/>
    <text x="32" y="31" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">m, 2v</text>
    <line x1="75" y1="26" x2="135" y2="26" stroke="#10b981" stroke-width="3"/>
    <polygon points="135,22 143,26 135,30" fill="#10b981"/>
    <!-- Kum zemin izi 4x -->
    <rect x="160" y="18" width="170" height="16" fill="#eab308" opacity="0.6"/>
    <text x="245" y="31" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">İz: 4x (Sürat 2 kat)</text>
    <text x="350" y="31" fill="#f8fafc" font-size="13">3. Düzenek (Kütle: m, Sürat: 2v)</text>
  </g>

  <text x="330" y="225" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Kontrollü Deney: Kütle için (1 ve 2); Sürat için (1 ve 3) karşılaştırılır.</text>
</svg>
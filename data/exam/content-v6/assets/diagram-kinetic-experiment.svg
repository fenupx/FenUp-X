<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>
  <!-- Kontrollü Deney: 3 Araç ve Kum Zemindeki Fren/Durma Mesafesi -->
  <!-- Araç A -->
  <g transform="translate(40, 20)">
    <rect x="0" y="15" width="70" height="35" rx="4" fill="#3b82f6"/>
    <text x="35" y="37" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">m, v</text>
    <line x1="80" y1="32" x2="110" y2="32" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="110,29 116,32 110,35" fill="#38bdf8"/>
    <!-- Kum zemin çukuru / izi: x -->
    <rect x="130" y="25" width="60" height="15" fill="#eab308" opacity="0.6"/>
    <text x="160" y="37" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">İz: x</text>
    <text x="210" y="37" fill="#f8fafc" font-size="13" font-family="system-ui, sans-serif">A Aracı (1 kg, 2 m/s)</text>
  </g>

  <!-- Araç B -->
  <g transform="translate(40, 80)">
    <rect x="0" y="15" width="70" height="35" rx="4" fill="#10b981"/>
    <text x="35" y="37" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">m, 2v</text>
    <line x1="80" y1="32" x2="130" y2="32" stroke="#10b981" stroke-width="3"/>
    <polygon points="130,28 138,32 130,36" fill="#10b981"/>
    <!-- Kum zemin izi: 4x -->
    <rect x="150" y="25" width="140" height="15" fill="#eab308" opacity="0.6"/>
    <text x="220" y="37" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">İz: 4x (Daha Uzun)</text>
    <text x="310" y="37" fill="#f8fafc" font-size="13" font-family="system-ui, sans-serif">B Aracı (1 kg, 4 m/s)</text>
  </g>

  <!-- Araç C -->
  <g transform="translate(40, 140)">
    <rect x="0" y="15" width="85" height="40" rx="4" fill="#ef4444"/>
    <text x="42" y="40" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">2m, 2v</text>
    <line x1="95" y1="35" x2="145" y2="35" stroke="#ef4444" stroke-width="3"/>
    <polygon points="145,31 153,35 145,39" fill="#ef4444"/>
    <!-- Kum zemin izi: 8x -->
    <rect x="165" y="28" width="190" height="15" fill="#eab308" opacity="0.6"/>
    <text x="260" y="40" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">İz: 8x (En Uzun)</text>
    <text x="375" y="40" fill="#f8fafc" font-size="13" font-family="system-ui, sans-serif">C Aracı (2 kg, 4 m/s)</text>
  </g>
  <text x="300" y="218" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Sonuç: Kütle ve sürat arttıkça kinetik enerji ve durma mesafesi artar.</text>
</svg>
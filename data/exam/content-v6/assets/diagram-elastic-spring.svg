<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>
  <!-- Sol Duvar -->
  <line x1="40" y1="30" x2="40" y2="170" stroke="#e2e8f0" stroke-width="6"/>
  <line x1="40" y1="170" x2="600" y2="170" stroke="#64748b" stroke-width="2"/>

  <!-- 1. Serbest Yay -->
  <g transform="translate(40, 40)">
    <path d="M 0 30 Q 15 15, 30 30 T 60 30 T 90 30 T 120 30 T 150 30 T 180 30 L 195 30" fill="none" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="210" cy="30" r="15" fill="#3b82f6"/>
    <text x="245" y="35" fill="#94a3b8" font-size="13">Serbest Hâl (Depolanan Enerji = 0)</text>
  </g>

  <!-- 2. Sıkıştırılmış Yay (Δx = 5 cm) -->
  <g transform="translate(40, 115)">
    <path d="M 0 30 Q 8 15, 16 30 T 32 30 T 48 30 T 64 30 T 80 30 T 96 30 L 108 30" fill="none" stroke="#f43f5e" stroke-width="4"/>
    <circle cx="123" cy="30" r="15" fill="#ef4444"/>
    <!-- Sıkışma Ölçüsü Oku -->
    <line x1="210" y1="20" x2="123" y2="20" stroke="#fde047" stroke-width="2"/>
    <polygon points="123,17 115,20 123,23" fill="#fde047"/>
    <text x="145" y="10" fill="#fde047" font-size="12" font-weight="bold">Δx = 5 cm</text>
    <text x="160" y="35" fill="#f43f5e" font-size="13" font-weight="bold">Sıkışmış Yay (Esneklik Potansiyeli Depolandı)</text>
  </g>
</svg>
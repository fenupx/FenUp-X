<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 210" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>
  <!-- Sol Duvar -->
  <line x1="50" y1="20" x2="50" y2="190" stroke="#cbd5e1" stroke-width="6"/>
  <line x1="50" y1="190" x2="620" y2="190" stroke="#64748b" stroke-width="2"/>

  <!-- 1. Serbest Hâl (Denge) -->
  <g transform="translate(50, 35)">
    <path d="M 0 30 Q 15 15, 30 30 T 60 30 T 90 30 T 120 30 T 150 30 T 180 30 L 195 30" fill="none" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="210" cy="30" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    <text x="240" y="35" fill="#94a3b8" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">1. Denge Hâli (Serbest Yay ve Top)</text>
  </g>

  <!-- 2. Sıkıştırılmış Hâl -->
  <g transform="translate(50, 115)">
    <path d="M 0 30 Q 8 15, 16 30 T 32 30 T 48 30 T 64 30 T 80 30 T 96 30 L 108 30" fill="none" stroke="#ef4444" stroke-width="4"/>
    <circle cx="122" cy="30" r="14" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="210" y1="10" x2="122" y2="10" stroke="#fbbf24" stroke-width="2"/>
    <polygon points="122,7 114,10 122,13" fill="#fbbf24"/>
    <text x="140" y="6" fill="#fbbf24" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">Sıkışma (5 cm)</text>
    <text x="240" y="35" fill="#ef4444" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">2. Sıkıştırılmış Yay (Önünde Top)</text>
  </g>
</svg>
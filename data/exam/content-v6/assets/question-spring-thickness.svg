<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>
  <line x1="45" y1="20" x2="45" y2="180" stroke="#64748b" stroke-width="6"/>

  <!-- 1. İnce Yay -->
  <g transform="translate(45, 25)">
    <line x1="0" y1="50" x2="560" y2="50" stroke="#64748b" stroke-width="1.5"/>
    <path d="M 0 32 Q 10 17, 20 32 T 40 32 T 60 32 T 80 32 L 95 32" fill="none" stroke="#0284c7" stroke-width="2"/>
    <circle cx="110" cy="32" r="14" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
    <text x="150" y="36" fill="#0284c7" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">1. Düzenek: İnce Telden Yay (10 cm sıkıştırıldı)</text>
  </g>

  <!-- 2. Kalın Yay -->
  <g transform="translate(45, 110)">
    <line x1="0" y1="50" x2="560" y2="50" stroke="#64748b" stroke-width="1.5"/>
    <path d="M 0 32 Q 10 15, 20 32 T 40 32 T 60 32 T 80 32 L 95 32" fill="none" stroke="#dc2626" stroke-width="5"/>
    <circle cx="110" cy="32" r="14" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
    <text x="150" y="36" fill="#dc2626" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">2. Düzenek: Kalın Telden Yay (10 cm sıkıştırıldı)</text>
  </g>
</svg>
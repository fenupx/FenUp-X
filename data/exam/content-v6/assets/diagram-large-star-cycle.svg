<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>
  <!-- 1. Büyük Kütleli Yıldız -->
  <g transform="translate(20, 75)">
    <circle cx="50" cy="50" r="32" fill="#2563eb" stroke="#93c5fd" stroke-width="2.5"/>
    <text x="50" y="105" fill="#0284c7" font-size="13" font-weight="bold" text-anchor="middle">Büyük Kütleli</text>
    <text x="50" y="122" fill="#94a3b8" font-size="11" text-anchor="middle">Yıldız (Mavi/Beyaz)</text>
  </g>
  <line x1="120" y1="125" x2="165" y2="125" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="165,121 173,125 165,129" fill="#38bdf8"/>

  <!-- 2. Kırmızı Süperdev -->
  <g transform="translate(180, 50)">
    <circle cx="60" cy="75" r="54" fill="#991b1b" stroke="#f87171" stroke-width="2.5"/>
    <text x="60" y="150" fill="#0284c7" font-size="13" font-weight="bold" text-anchor="middle">Kırmızı Süperdev</text>
  </g>
  <line x1="310" y1="125" x2="355" y2="125" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="355,121 363,125 355,129" fill="#38bdf8"/>

  <!-- 3. Süpernova Patlaması -->
  <g transform="translate(370, 50)">
    <path d="M 50 15 L 62 45 L 95 40 L 72 65 L 100 90 L 68 95 L 60 130 L 40 100 L 10 115 L 28 80 L 0 60 L 35 50 Z" fill="#fbbf24" stroke="#ffffff" stroke-width="2"/>
    <circle cx="50" cy="70" r="18" fill="#ef4444"/>
    <text x="50" y="150" fill="#0284c7" font-size="13" font-weight="bold" text-anchor="middle">Süpernova</text>
    <text x="50" y="167" fill="#fde047" font-size="11" font-weight="bold" text-anchor="middle">Şiddetli Patlama</text>
  </g>

  <!-- Çatallanma Okları -->
  <line x1="480" y1="110" x2="530" y2="65" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="530,60 538,62 533,70" fill="#38bdf8"/>
  <line x1="480" y1="140" x2="530" y2="185" stroke="#a855f7" stroke-width="2.5"/>
  <polygon points="533,180 538,188 530,190" fill="#a855f7"/>

  <!-- Son 1: Nötron Yıldızı -->
  <g transform="translate(545, 25)">
    <circle cx="45" cy="40" r="14" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
    <text x="45" y="75" fill="#0284c7" font-size="13" font-weight="bold" text-anchor="middle">Nötron Yıldızı</text>
    <text x="45" y="92" fill="#94a3b8" font-size="11" text-anchor="middle">Kalan kütle orta-büyük</text>
  </g>

  <!-- Son 2: Kara Delik -->
  <g transform="translate(545, 145)">
    <circle cx="45" cy="40" r="18" fill="#000000" stroke="#0284c7" stroke-width="2"/>
    <circle cx="45" cy="40" r="28" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="45" y="85" fill="#0284c7" font-size="13" font-weight="bold" text-anchor="middle">Kara Delik</text>
    <text x="45" y="102" fill="#94a3b8" font-size="11" text-anchor="middle">Kalan kütle aşırı büyük</text>
  </g>
</svg>
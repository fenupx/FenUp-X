<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>

  <!-- Zemin Çizgisi -->
  <line x1="30" y1="165" x2="670" y2="165" stroke="#64748b" stroke-width="2.5"/>
  <rect x="30" y="165" width="640" height="8" fill="#94a3b8" opacity="0.25"/>
  <text x="660" y="180" fill="#64748b" font-size="11" font-weight="bold" text-anchor="end" font-family="system-ui, -apple-system, sans-serif">Zemin Seviyesi (h = 0)</text>

  <!-- 1. ÖRNEK: Yüksek Raftaki Kitap (Sol) -->
  <g transform="translate(120, 20)">
    <!-- Raf Dikmeleri ve Raf -->
    <line x1="-55" y1="145" x2="-55" y2="60" stroke="#64748b" stroke-width="2.5"/>
    <line x1="55" y1="145" x2="55" y2="60" stroke="#64748b" stroke-width="2.5"/>
    <rect x="-65" y="60" width="130" height="7" rx="2" fill="#0284c7"/>
    <!-- Kitap -->
    <rect x="-22" y="32" width="44" height="28" rx="2" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="-16" y1="36" x2="-16" y2="56" stroke="#bae6fd" stroke-width="2"/>
    <line x1="-8" y1="40" x2="14" y2="40" stroke="#bae6fd" stroke-width="1.5"/>
    <line x1="-8" y1="48" x2="10" y2="48" stroke="#bae6fd" stroke-width="1.5"/>
    <!-- Yükseklik Oku -->
    <line x1="-40" y1="65" x2="-40" y2="145" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="-48" y="108" fill="#0284c7" font-size="11" font-weight="bold" text-anchor="end" font-family="system-ui, -apple-system, sans-serif">h</text>
    <!-- Metinler -->
    <text x="0" y="16" fill="#0284c7" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Raftaki Kitap</text>
    <rect x="-62" y="80" width="124" height="22" rx="4" fill="#0284c7" opacity="0.12"/>
    <text x="0" y="95" fill="#0284c7" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Çekim Potansiyeli VAR</text>
  </g>

  <!-- 2. ÖRNEK: Ağaç Dalındaki Elma (Orta) -->
  <g transform="translate(350, 20)">
    <!-- Ağaç Dalı -->
    <path d="M -70 25 Q -10 35 70 30" stroke="#78350f" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Elma Sapı ve Yaprak -->
    <line x1="0" y1="32" x2="0" y2="44" stroke="#78350f" stroke-width="2"/>
    <path d="M 0 34 Q 8 28 14 34 Q 8 40 0 34" fill="#16a34a"/>
    <!-- Kırmızı Elma -->
    <circle cx="0" cy="56" r="14" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Yükseklik Oku -->
    <line x1="45" y1="65" x2="45" y2="145" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="55" y="108" fill="#dc2626" font-size="11" font-weight="bold" text-anchor="start" font-family="system-ui, -apple-system, sans-serif">h</text>
    <!-- Metinler -->
    <text x="0" y="16" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Daldaki Elma</text>
    <rect x="-62" y="80" width="124" height="22" rx="4" fill="#dc2626" opacity="0.12"/>
    <text x="0" y="95" fill="#dc2626" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Çekim Potansiyeli VAR</text>
  </g>

  <!-- 3. ÖRNEK: Yerdeki Top (Sağ) -->
  <g transform="translate(570, 20)">
    <!-- Top (Zeminde) -->
    <circle cx="0" cy="131" r="14" fill="#d97706" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="-12" y1="131" x2="12" y2="131" stroke="#fef3c7" stroke-width="2"/>
    <!-- Metinler -->
    <text x="0" y="16" fill="#d97706" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Yerdeki Top</text>
    <rect x="-60" y="80" width="120" height="22" rx="4" fill="#d97706" opacity="0.12"/>
    <text x="0" y="95" fill="#d97706" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">h = 0 (Potansiyel: 0)</text>
    <text x="0" y="112" fill="#64748b" font-size="10" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">(Referans Zemin)</text>
  </g>

  <!-- Alt Bilgi / Kavram Yanılgısı Uyarısı -->
  <rect x="70" y="172" width="460" height="22" rx="4" fill="#0f172a" opacity="0.06"/>
  <text x="300" y="187" fill="#475569" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">💡 Önemli: Cisim duruyor olsa bile yerden yüksekte ise çekim potansiyel enerjisi vardır.</text>
</svg>
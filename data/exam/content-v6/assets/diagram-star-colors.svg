<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>
  <!-- Sıcaklık - Renk Skalası -->
  <g transform="translate(40, 30)">
    <!-- Mavi / Beyaz -->
    <circle cx="60" cy="60" r="35" fill="#38bdf8" stroke="#ffffff" stroke-width="3"/>
    <text x="60" y="125" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Mavi / Beyaz</text>
    <text x="60" y="145" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">En Sıcak Yıldızlar</text>
    <text x="60" y="162" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">> 10.000 °C</text>
  </g>

  <g transform="translate(240, 30)">
    <!-- Sarı (Güneş) -->
    <circle cx="60" cy="60" r="30" fill="#eab308" stroke="#fef08a" stroke-width="2"/>
    <text x="60" y="125" fill="#eab308" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Sarı</text>
    <text x="60" y="145" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Orta Sıcaklık (Güneş)</text>
    <text x="60" y="162" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">~ 5.500 - 6.000 °C</text>
  </g>

  <g transform="translate(440, 30)">
    <!-- Kırmızı -->
    <circle cx="60" cy="60" r="25" fill="#ef4444" stroke="#fca5a5" stroke-width="2"/>
    <text x="60" y="125" fill="#ef4444" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Kırmızı / Turuncu</text>
    <text x="60" y="145" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">En Soğuk Yıldızlar</text>
    <text x="60" y="162" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">~ 3.000 °C</text>
  </g>
</svg>
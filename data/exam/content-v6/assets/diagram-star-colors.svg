<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>

  <!-- Sıcaklık Değişim Oku (Kırmızıdan Maviye) -->
  <g transform="translate(110, 25)">
    <line x1="450" y1="0" x2="15" y2="0" stroke="#38bdf8" stroke-width="2.5"/>
    <polygon points="15,-5 0,0 15,5" fill="#38bdf8"/>
    <text x="230" y="-8" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Yüzey Sıcaklığı Artış Yönü</text>
  </g>

  <!-- 1. Mavi / Beyaz Yıldız (X) -->
  <g transform="translate(130, 95)">
    <circle cx="0" cy="0" r="32" fill="#0284c7" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="0" y="55" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Mavi Yıldız (X)</text>
    <text x="0" y="72" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">En Sıcak</text>
  </g>

  <!-- 2. Sarı Yıldız (Y - Güneş) -->
  <g transform="translate(340, 95)">
    <circle cx="0" cy="0" r="28" fill="#eab308" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#fde047" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="0" y="55" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Sarı Yıldız (Y - Güneş)</text>
    <text x="0" y="72" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Orta Sıcaklık</text>
  </g>

  <!-- 3. Kırmızı Yıldız (Z) -->
  <g transform="translate(550, 95)">
    <circle cx="0" cy="0" r="24" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="55" fill="#ef4444" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Kırmızı Yıldız (Z)</text>
    <text x="0" y="72" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">En Soğuk</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>
  <!-- 3 Yıldız Grubu -->
  <!-- Mavi / Beyaz -->
  <g transform="translate(40, 20)">
    <circle cx="60" cy="55" r="38" fill="#0284c7" stroke="#ffffff" stroke-width="3"/>
    <circle cx="60" cy="55" r="48" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
    <text x="60" y="120" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">Mavi / Beyaz</text>
    <text x="60" y="138" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">> 10.000 °C</text>
    <text x="60" y="154" fill="#94a3b8" font-size="11" text-anchor="middle">En Sıcak Yıldızlar</text>
  </g>

  <!-- Sarı (Güneş) -->
  <g transform="translate(260, 20)">
    <circle cx="60" cy="55" r="30" fill="#eab308" stroke="#fef08a" stroke-width="2.5"/>
    <text x="60" y="120" fill="#eab308" font-size="14" font-weight="bold" text-anchor="middle">Sarı</text>
    <text x="60" y="138" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">~ 5.500 - 6.000 °C</text>
    <text x="60" y="154" fill="#94a3b8" font-size="11" text-anchor="middle">Orta Sıcaklık (Güneş)</text>
  </g>

  <!-- Kırmızı -->
  <g transform="translate(460, 20)">
    <circle cx="60" cy="55" r="26" fill="#dc2626" stroke="#fca5a5" stroke-width="2"/>
    <text x="60" y="120" fill="#ef4444" font-size="14" font-weight="bold" text-anchor="middle">Kırmızı / Turuncu</text>
    <text x="60" y="138" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">~ 3.000 °C</text>
    <text x="60" y="154" fill="#94a3b8" font-size="11" text-anchor="middle">En Soğuk Yıldızlar</text>
  </g>

  <!-- Altta Sıcaklık Artış Yönü Oku (Kırmızıdan Maviye doğru!) -->
  <g transform="translate(60, 180)">
    <line x1="500" y1="15" x2="40" y2="15" stroke="#f43f5e" stroke-width="3"/>
    <polygon points="40,9 26,15 40,21" fill="#f43f5e"/>
    <text x="270" y="10" fill="#f43f5e" font-size="13" font-weight="bold" text-anchor="middle">Yüzey Sıcaklığı Artar (Kırmızıdan Maviye Doğru)</text>
  </g>
</svg>
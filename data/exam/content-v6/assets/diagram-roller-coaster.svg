<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>
  <!-- Zemin Çizgisi -->
  <line x1="30" y1="200" x2="630" y2="200" stroke="#64748b" stroke-width="2"/>
  <text x="50" y="220" fill="#94a3b8" font-size="12">Yer Seviyesi (h = 0)</text>

  <!-- Ray Eğrisi -->
  <path d="M 50 60 C 140 60, 170 190, 260 190 C 330 190, 360 110, 440 110 C 510 110, 540 180, 600 180" fill="none" stroke="#38bdf8" stroke-width="4"/>

  <!-- A Noktası: Zirve -->
  <g transform="translate(75, 40)">
    <circle cx="0" cy="20" r="13" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="-8" fill="#ef4444" font-size="15" font-weight="bold" text-anchor="middle">A Noktası</text>
    <text x="0" y="55" fill="#f8fafc" font-size="11" text-anchor="middle">Ep: Maksimum</text>
    <text x="0" y="70" fill="#94a3b8" font-size="11" text-anchor="middle">Ek: 0 (Durgun)</text>
  </g>

  <!-- B Noktası: En Alt Dip -->
  <g transform="translate(260, 165)">
    <circle cx="0" cy="25" r="13" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="56" fill="#10b981" font-size="15" font-weight="bold" text-anchor="middle">B Noktası</text>
    <text x="0" y="72" fill="#f8fafc" font-size="11" text-anchor="middle">Ep: 0 (Dip)</text>
    <text x="0" y="87" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Ek: Maksimum (En Hızlı)</text>
  </g>

  <!-- C Noktası: Ara Tepe -->
  <g transform="translate(440, 85)">
    <circle cx="0" cy="25" r="13" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" fill="#f59e0b" font-size="15" font-weight="bold" text-anchor="middle">C Noktası</text>
    <text x="0" y="60" fill="#f8fafc" font-size="11" text-anchor="middle">Ep: Orta Düzey</text>
    <text x="0" y="75" fill="#f8fafc" font-size="11" text-anchor="middle">Ek: Orta Düzey</text>
  </g>
</svg>
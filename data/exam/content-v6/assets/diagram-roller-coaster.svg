<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>

  <!-- Ray Hattı -->
  <path d="M 40,40 C 140,40 180,180 300,180 C 400,180 440,90 520,90 C 580,90 620,170 650,180" fill="none" stroke="#64748b" stroke-width="4"/>

  <!-- A Noktası (Tepe) -->
  <g transform="translate(60, 40)">
    <circle cx="0" cy="0" r="14" fill="#ef4444" stroke="#ffffff" stroke-width="2.5"/>
    <text x="0" y="5" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">A</text>
    <text x="0" y="-30" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">En Yüksek Tepe</text>
    <text x="0" y="-14" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Çekim Potansiyel: En Fazla</text>
    <text x="0" y="32" fill="#94a3b8" font-size="11" text-anchor="middle">Kinetik Enerji: Sıfır (Durgun)</text>
  </g>

  <!-- B Noktası (Dip Zemin) -->
  <g transform="translate(300, 180)">
    <circle cx="0" cy="0" r="14" fill="#10b981" stroke="#ffffff" stroke-width="2.5"/>
    <text x="0" y="5" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">B</text>
    <text x="0" y="28" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">En Alt Nokta (Dip)</text>
    <text x="0" y="44" fill="#10b981" font-size="11" font-weight="bold" text-anchor="middle">Kinetik Enerji: En Fazla (Maksimum Sürat)</text>
  </g>

  <!-- C Noktası (İkinci Tepe) -->
  <g transform="translate(520, 90)">
    <circle cx="0" cy="0" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="2.5"/>
    <text x="0" y="5" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">C</text>
    <text x="0" y="-28" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">İkinci Tepe</text>
    <text x="0" y="-12" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Potansiyel ve Kinetik Enerji</text>
  </g>
</svg>
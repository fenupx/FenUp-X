<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>

  <!-- Ray Hattı -->
  <path d="M 40,45 C 130,45 170,175 280,175 C 380,175 420,95 500,95 C 560,95 600,165 640,175" fill="none" stroke="#64748b" stroke-width="4"/>

  <!-- A Noktası (Tepe) -->
  <g transform="translate(60, 45)">
    <circle cx="0" cy="0" r="14" fill="#ef4444" stroke="#ffffff" stroke-width="2.5"/>
    <text x="0" y="5" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">A</text>
  </g>
  <rect x="15" y="8" width="90" height="22" rx="11" fill="#0f172a" stroke="#ef4444"/>
  <text x="60" y="23" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">A (Tepe)</text>
  <rect x="10" y="70" width="145" height="22" rx="11" fill="#0f172a" stroke="#334155"/>
  <text x="82" y="85" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Potansiyel En Fazla</text>

  <!-- B Noktası (Dip Zemin) -->
  <g transform="translate(280, 175)">
    <circle cx="0" cy="0" r="14" fill="#10b981" stroke="#ffffff" stroke-width="2.5"/>
    <text x="0" y="5" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">B</text>
  </g>
  <rect x="235" y="130" width="90" height="22" rx="11" fill="#0f172a" stroke="#10b981"/>
  <text x="280" y="145" fill="#10b981" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">B (Dip)</text>
  <rect x="210" y="200" width="140" height="22" rx="11" fill="#0f172a" stroke="#334155"/>
  <text x="280" y="215" fill="#10b981" font-size="10" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Kinetik En Fazla</text>

  <!-- C Noktası (İkinci Tepe) -->
  <g transform="translate(500, 95)">
    <circle cx="0" cy="0" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="2.5"/>
    <text x="0" y="5" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">C</text>
  </g>
  <rect x="455" y="58" width="90" height="22" rx="11" fill="#0f172a" stroke="#38bdf8"/>
  <text x="500" y="73" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">C (Tepe)</text>
  <rect x="435" y="125" width="130" height="22" rx="11" fill="#0f172a" stroke="#334155"/>
  <text x="500" y="140" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Enerji Dönüşümü</text>
</svg>
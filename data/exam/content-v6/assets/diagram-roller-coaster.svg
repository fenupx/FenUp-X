<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>
  <!-- Hız Treni Ray Profili ve Mekanik Enerji Dönüşümü -->
  <!-- Zemin Çizgisi -->
  <line x1="30" y1="190" x2="570" y2="190" stroke="#64748b" stroke-width="2"/>
  <text x="50" y="210" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">Yer Seviyesi (h = 0)</text>

  <!-- Ray Eğrisi -->
  <path d="M 50 50 C 130 50, 160 180, 240 180 C 310 180, 340 100, 420 100 C 490 100, 520 170, 560 170" fill="none" stroke="#38bdf8" stroke-width="4"/>

  <!-- Nokta A: Zirve -->
  <g transform="translate(70, 30)">
    <circle cx="0" cy="20" r="12" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="-5" fill="#ef4444" font-size="14" font-weight="bold" text-anchor="middle">A Noktası</text>
    <text x="0" y="55" fill="#f8fafc" font-size="11" text-anchor="middle">Ep: Maksimum</text>
    <text x="0" y="70" fill="#94a3b8" font-size="11" text-anchor="middle">Ek: 0 (Durgun)</text>
  </g>

  <!-- Nokta B: Dip Vadi -->
  <g transform="translate(240, 155)">
    <circle cx="0" cy="25" r="12" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="52" fill="#10b981" font-size="14" font-weight="bold" text-anchor="middle">B Noktası</text>
    <text x="0" y="67" fill="#f8fafc" font-size="11" text-anchor="middle">Ep: 0 (En Alt)</text>
    <text x="0" y="82" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Ek: Maksimum</text>
  </g>

  <!-- Nokta C: Ara Tepe -->
  <g transform="translate(420, 75)">
    <circle cx="0" cy="25" r="12" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" fill="#f59e0b" font-size="14" font-weight="bold" text-anchor="middle">C Noktası</text>
    <text x="0" y="60" fill="#f8fafc" font-size="11" text-anchor="middle">Ep: Orta Seviye</text>
    <text x="0" y="75" fill="#f8fafc" font-size="11" text-anchor="middle">Ek: Orta Seviye</text>
  </g>
</svg>